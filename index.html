function renderView(){
  if(allowedViewsForRole().indexOf(STATE.view)===-1){ STATE.view = defaultViewForRole(); }
  switch(STATE.view){
    case 'dashboard': return renderDashboard();
    case 'quickSale': return renderQuickSale();
    case 'sales': return renderSales();
    case 'invoice': return renderInvoice();
    case 'credit': return renderCredit();
    case 'dayClose': return renderDayClose();
    case 'loans': return renderLoans();
    case 'calendar': return renderCalendar();
    case 'products': return renderProducts();
    case 'stockPurchase': return renderStockPurchase();
    case 'expenses': return renderExpenses();
    case 'reports': return renderReports();
    case 'settings': return renderSettings();
    default: return '';
  }
}

/* ---------------- DASHBOARD ---------------- */
function statCard(title,value,sub,colorClass){
  var cnt = countAttr(value);
  return '<div class="card stat-card"><h3>'+esc(title)+'</h3><div class="stat-value '+(colorClass||'')+'"'+cnt+'>'+esc(value)+'</div>'+(sub?'<div class="stat-sub">'+esc(sub)+'</div>':'')+'</div>';
}
function netProfitColorClass(pct, net){
  if(pct===null || pct===undefined) return net>=0 ? 'sv-green' : 'sv-red';
  if(pct>=100) return 'sv-green';
  if(pct>=50) return 'sv-blue';
  return 'sv-yellow';
}
function sectionHead(title, sub, icon){
  return '<div class="sec-head"><span class="icon-badge badge-neutral sec-ic">'+uiIcon(icon||'chart','icon-sm')+'</span>'+
    '<div><h2>'+esc(title)+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div></div>';
}

function countAttr(value){
  var mE = /^(-?[\d,]+(?:\.\d+)?) ETB$/.exec(String(value));
  var mP = /^(-?[\d.]+)%$/.exec(String(value));
  if(mE) return ' data-count="'+mE[1].replace(/,/g,'')+'" data-fmt="etb"';
  if(mP) return ' data-count="'+mP[1]+'" data-fmt="pct"';
  return '';
}
/* One hero card, used on the Dashboard and at the top of every section. */
/* figures for the hero card at the top of a section */
function monthRange(){ return {from:isoDate(startOfMonth(new Date())), to:todayStr()}; }
function unitsSold(arr){ return round2(arr.reduce(function(a,s){ return a+(s.quantity||0); },0)); }

function heroCard(label, value, tiles, opts){
  opts = opts || {};
  return '<div class="hero-card">'+
    '<div class="hero-top"><span class="hero-label">'+esc(label)+'</span>'+(opts.selectHtml||'')+'</div>'+
    '<div class="hero-value"'+countAttr(value)+'>'+esc(value)+'</div>'+
    ((tiles&&tiles.length) ? '<div class="hero-tiles">'+tiles.map(function(t){
      return '<div class="hero-tile"><span>'+esc(t[0])+'</span><b'+countAttr(t[1])+'>'+esc(t[1])+'</b></div>';
    }).join('')+'</div>' : '')+
    (opts.note ? '<div class="hero-note">'+esc(opts.note)+'</div>' : '')+
  '</div>';
}

function renderDashboard(){
  var period = STATE.dashboardPeriod||'today';
  var range = periodRangeFor(period);
  var stats = periodStats(range.from, range.to);
  var lowStock = STATE.data.products.filter(function(p){ return (p.currentStock||0) <= (p.reorderLevel||0); });
  var tSales = topDay('sales');
  var tProfit = topDay('profit');
  var goal = goalFor(period);
  var pct = goal>0 ? Math.min(100, round2((stats.totalSales/goal)*100)) : null;
  var storeBalance = currentStoreBalance();
  var coll = collectionsByMethod(range.from, range.to);
  var creditOut = totalCreditOutstanding();
  var custs = creditCustomers();
  var overdueList = custs.filter(function(c){ return c.overdue; });
  var overdueAmt = round2(overdueList.reduce(function(a,c){ return a+c.balance; },0));
  var owing = custs.filter(function(c){ return c.balance>0; }).length;

  var opts = [['today','Today'],['week','This Week'],['month','This Month'],['year','This Year']];
  var heroLabels = {today:'Sales today', week:'Sales this week', month:'Sales this month', year:'Sales this year'};
  var select = '<select id="dashPeriod" class="hero-select" aria-label="Period">'+opts.map(function(o){
    return '<option value="'+o[0]+'"'+(period===o[0]?' selected':'')+'>'+o[1]+'</option>';
  }).join('')+'</select>';

  /* ---- 1. the one thing that matters: sales, with profit and cash beside it ---- */
  var html = heroCard(heroLabels[period], fmtETB(stats.totalSales), [['Profit', fmtETB(stats.net)], ['Cash balance', fmtETB(storeBalance)]], {selectHtml:select});

  /* ---- 2. only what needs attention ---- */
  if(overdueList.length){
    html += '<div class="lowstock-banner" style="background:var(--red-bg);color:var(--red);border-color:#f0b8b8;">'+uiIcon('alert','icon-md')+
      '<span><b>'+overdueList.length+' customer'+(overdueList.length>1?'s are':' is')+' overdue — '+fmtETB(overdueAmt)+'</b></span>'+
      '<button class="link-btn" data-nav="credit" style="margin-left:auto;">View credit</button></div>';
  }
  if(lowStock.length){
    html += '<div class="lowstock-banner">'+uiIcon('alert','icon-md')+'<span>'+lowStock.length+' product'+(lowStock.length>1?'s':'')+' running low — '+
      lowStock.slice(0,3).map(function(p){return esc(p.name);}).join(', ') + (lowStock.length>3?'…':'') + '</span>'+
      ' <button class="link-btn" data-nav="products" style="margin-left:auto;">View</button></div>';
  }
  var exg = expiryGroups();
  if(exg.expired.length || exg.d30.length || exg.d60.length){
    var expParts = [];
    function expPart(list, label){ if(list.length) expParts.push('<b>'+label+' ('+list.length+'):</b> '+list.slice(0,2).map(function(p){ return esc(p.name); }).join(', ')+(list.length>2?'…':'')); }
    expPart(exg.expired, 'Already expired'); expPart(exg.d30, 'Expiring within 30 days'); expPart(exg.d60, 'Expiring within 60 days');
    var expRed = exg.expired.length || exg.d30.length;
    html += '<div class="lowstock-banner"'+(expRed?' style="background:var(--red-bg);color:var(--red);border-color:#f0b8b8;"':'')+'>'+uiIcon('alert','icon-md')+
      '<span>'+expParts.join(' · ')+' — sell or discount them first.</span>'+
      '<button class="link-btn" data-nav="products" style="margin-left:auto;">View</button></div>';
  }
  if(period==='month' || period==='year'){
    var periodCashDelta = cashDeltaForRange(range.from, range.to);
    if(periodCashDelta < 0){
      html += '<div class="lowstock-banner" style="background:var(--red-bg);color:var(--red);border-color:#f0b8b8;">'+uiIcon('alert','icon-md')+
        '<span><b>Stock purchases + expenses exceeded cash collected by '+fmtETB(Math.abs(periodCashDelta))+' this '+(period==='month'?'month':'year')+'.</b> '+
        'This was funded from your Store Balance reserve — your accounting Net Profit is not affected.</span></div>';
    }
  }

  /* ---- 3. quick actions ---- */
  html += '<div class="quick-actions">'+
    '<button class="qa" data-nav="quickSale"><span class="icon-badge badge-neutral">'+uiIcon('plus','icon-md')+'</span>New sale</button>'+
    '<button class="qa" data-nav="stockPurchase"><span class="icon-badge badge-neutral">'+uiIcon('cart','icon-md')+'</span>Stock in</button>'+
    '<button class="qa" data-nav="expenses"><span class="icon-badge badge-neutral">'+uiIcon('dollar','icon-md')+'</span>Expense</button>'+
  '</div>';

  /* ---- 4. goal, if one is set ---- */
  if(goal>0){
    var remaining = Math.max(0, round2(goal-stats.totalSales));
    html += '<div class="goal-mini"><div class="goal-mini-top"><span>Sales Goal · '+fmtETB(stats.totalSales)+' of '+fmtETB(goal)+'</span><b>'+pct+'%</b></div>'+
      '<div class="progress-track lg"><div class="progress-fill'+(pct>=100?' over':'')+'" style="width:'+pct+'%;"></div></div>'+
      '<div class="stat-sub" style="margin-top:6px;">'+(pct>=100 ? 'Goal reached' : (fmtETB(remaining)+' more to reach your goal'))+'</div></div>';
  }

  /* ---- 5. money received ---- */
  html += '<div class="card"><h3 style="margin-bottom:6px;">Money received</h3>'+
    '<div class="list-item"><span>Cash</span><b>'+fmtETB(coll.cash)+'</b></div>'+
    '<div class="list-item"><span>Telebirr / Bank</span><b>'+fmtETB(coll.digital)+'</b></div>'+
    '<div class="list-item"><span>Customers owe you</span><b style="color:'+(creditOut>0?'var(--red)':'var(--success)')+';">'+fmtETB(creditOut)+'</b></div>'+
    (loansOutstanding()>0 ? '<div class="list-item"><span>Cash loans out</span><b style="color:var(--amber);">'+fmtETB(loansOutstanding())+'</b></div>' : '')+
  '</div>';

  /* ---- 6. everything else, one tap away ---- */
  var detailsBody =
    sectionHead('Performance', range.label+' · '+stats.count+' sale'+(stats.count!==1?'s':''), 'chart')+
    '<div class="grid grid-4">'+
      statCard('Total Sales', fmtETB(stats.totalSales), null, 'sv-black')+
      statCard('Gross Profit', fmtETB(stats.gross), null, 'sv-green')+
      statCard('Expenses', fmtETB(stats.expenses), null, 'sv-red')+
      statCard('Net Profit', fmtETB(stats.net), null, netProfitColorClass(pct, stats.net))+
    '</div>'+
    '<div class="grid grid-4" style="margin-top:14px;">'+
      statCard('Average sale', fmtETB(stats.count>0 ? round2(stats.totalSales/stats.count) : 0), 'Per sale in this period', 'sv-black')+
      statCard('Items sold', String(round2(salesInRange(range.from, range.to).reduce(function(a,s){ return a+(s.quantity||0); },0))), 'Units sold in this period', 'sv-black')+
      statCard('Discounts given', fmtETB(discountsIn(salesInRange(range.from, range.to))), 'Price reductions in this period', 'sv-black')+
    '</div>'+
    sectionHead('Cash & Collections', 'Money actually received — separate from profit', 'dollar')+
    '<div class="grid grid-4">'+
      statCard('Current Store Balance', fmtETB(storeBalance), 'Cash in − stock purchases − expenses', storeBalance>=0?'sv-green':'sv-red')+
      statCard('Collected in cash', fmtETB(coll.cash), range.label, 'sv-black')+
      statCard('Telebirr / Bank', fmtETB(coll.digital), 'Telebirr '+fmtETB(coll.telebirr)+' · CBE '+fmtETB(coll.cbe)+' · Bank '+fmtETB(coll.bank), 'sv-black')+
      statCard('Customer credit', fmtETB(creditOut), owing+' customer'+(owing!==1?'s':'')+' owe you'+(overdueList.length?(' · '+overdueList.length+' overdue'):''), creditOut>0?'sv-red':'sv-green')+
    '</div>'+
    sectionHead('Records', 'Your best days so far', 'award')+
    '<div class="grid grid-2">'+
      '<div class="card trophy-card"><div class="icon-badge badge-gold trophy-emoji">'+uiIcon('award','icon-lg')+'</div><div><h3 style="margin-bottom:2px;">Top Sales Day</h3>'+
        (tSales?('<div class="trophy-date">'+fmtDateLong(tSales.date)+'</div><div class="trophy-amt">'+fmtETB(tSales.amount)+'</div>'):'<div class="muted">No sales recorded yet</div>')+
        '</div></div>'+
      '<div class="card trophy-card"><div class="icon-badge badge-gold trophy-emoji">'+uiIcon('award','icon-lg')+'</div><div><h3 style="margin-bottom:2px;">Top Profit Day</h3>'+
        (tProfit?('<div class="trophy-date">'+fmtDateLong(tProfit.date)+'</div><div class="trophy-amt">'+fmtETB(tProfit.amount)+'</div>'):'<div class="muted">No sales recorded yet</div>')+
        '</div></div>'+
    '</div>'+
    renderPlanner();
  html += '<div class="acc'+(STATE.dashMore?' open':'')+'" style="margin-top:6px;">'+
    '<button type="button" class="acc-head" data-act="dash-more" aria-expanded="'+(STATE.dashMore?'true':'false')+'">'+
      '<span class="icon-badge badge-neutral acc-ic">'+uiIcon('chart','icon-sm')+'</span>'+
      '<span class="acc-title"><b>More details</b><small>Profit, collections, records and tips</small></span>'+
      '<span class="acc-chev">'+uiIcon('chevron','icon-sm')+'</span>'+
    '</button>'+
    (STATE.dashMore ? '<div class="acc-body acc-anim" style="padding-top:4px;">'+detailsBody+'</div>' : '')+
  '</div>';
  return html;
}

function periodRangeFor(period){
  var t = new Date();
  if(period==='week') return {from:isoDate(startOfWeek(t)), to:todayStr(), label:'This Week'};
  if(period==='month') return {from:isoDate(startOfMonth(t)), to:todayStr(), label:'This Month'};
  if(period==='year') return {from:isoDate(startOfYear(t)), to:todayStr(), label:'This Year'};
  return {from:todayStr(), to:todayStr(), label:'Today'};
}
function goalFor(period){
  var g = STATE.shopProfile || {};
  var map = {today:'dailyGoal', week:'weeklyGoal', month:'monthlyGoal', year:'yearlyGoal'};
  return parseFloat(g[map[period]])||0;
}

function renderPlanner(){
  var t = todayStr();
  var todayStats = periodStats(t,t);
  var moStart = isoDate(startOfMonth(new Date()));
  var monthStats = periodStats(moStart, t);
  var prevMonthAnchor = new Date(); prevMonthAnchor.setDate(1); prevMonthAnchor.setMonth(prevMonthAnchor.getMonth()-1);
  var prevMoStart = isoDate(startOfMonth(prevMonthAnchor));
  var prevMoEnd = isoDate(addDays(startOfMonth(new Date()), -1));
  var prevMonthStats = periodStats(prevMoStart, prevMoEnd);
  var lowStock = STATE.data.products.filter(function(p){ return (p.currentStock||0) <= (p.reorderLevel||0); });
  var items = [];

  if(todayStats.count===0){
    items.push({icon:'note', badge:'badge-warn', title:'No sales logged today yet', text:'Remember to record every sale before closing up — even small ones add up in your reports.'});
  } else {
    items.push({icon:'check', badge:'badge-good', title:todayStats.count+' sale'+(todayStats.count!==1?'s':'')+' logged today', text:'Keep it up — total so far: '+fmtETB(todayStats.totalSales)+'.'});
  }

  if(lowStock.length){
    items.push({icon:'box', badge:'badge-warn', title:lowStock.length+' product'+(lowStock.length>1?'s':'')+' low on stock', text:lowStock.slice(0,5).map(function(p){return p.name;}).join(', ')+' — consider restocking soon.'});
  } else if(STATE.data.products.length){
    items.push({icon:'box', badge:'badge-good', title:'Stock levels look healthy', text:'No products are at or below their reorder level right now.'});
  }

  var expenseRatio = monthStats.totalSales>0 ? round2((monthStats.expenses/monthStats.totalSales)*100) : 0;
  if(monthStats.expenses>0 && expenseRatio>30){
    items.push({icon:'dollar', badge:'badge-warn', title:'Expenses are '+expenseRatio+'% of this month\'s sales', text:'That is on the high side — review your expense categories for anything you can cut.'});
  } else if(monthStats.expenses>0){
    items.push({icon:'dollar', badge:'badge-good', title:'Expenses under control', text:'Running at '+expenseRatio+'% of this month\'s sales so far.'});
  }

  if(monthStats.totalSales>0){
    var netNow = monthStats.net;
    items.push({icon: netNow<0?'trendDown':'trendUp', badge: netNow<0?'badge-warn':'badge-good', title:'This month\'s net profit: '+fmtETB(netNow), text: netNow<0 ? 'You are running at a loss this month — check pricing and expenses.' : 'Net profit so far this month, after expenses.'});
  }

  var overdueC = creditCustomers().filter(function(c){ return c.overdue; });
  if(overdueC.length){
    items.push({icon:'users', badge:'badge-warn', title:overdueC.length+' customer'+(overdueC.length>1?'s are':' is')+' overdue on credit', text:overdueC.slice(0,3).map(function(c){return c.name+' ('+fmtETB(c.balance)+')';}).join(', ')+' — follow up and record the payment in Customer Credit.'});
  } else if(totalCreditOutstanding()>0){
    items.push({icon:'users', badge:'badge-neutral', title:fmtETB(totalCreditOutstanding())+' is owed by customers', text:'Nobody is overdue yet. Check Customer Credit to see upcoming due dates.'});
  }
  items.push({icon:'calendar', badge:'badge-neutral', title:'Weekly routine', text:'Count physical stock, review your top-selling products, and reconcile cash with recorded sales.'});

  var dayOfMonth = new Date().getDate();
  var daysInThisMonth = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  if(daysInThisMonth - dayOfMonth <= 3){
    items.push({icon:'chart', badge:'badge-warn', title:'Month-end is near', text:'Review your full Reports for the month, compare to last month ('+fmtETB(prevMonthStats.totalSales)+' in sales), and plan next month\'s goal.'});
  }

  return '<div class="section-title">'+uiIcon('calendar','icon-sm')+' Store Success Planner</div>'+
    '<div class="card">'+ items.map(function(i){
      return '<div class="planner-item"><span class="icon-badge '+i.badge+'" style="width:30px;height:30px;flex-shrink:0;">'+uiIcon(i.icon,'icon-sm')+'</span><div><b>'+esc(i.title)+'</b><span class="muted">'+esc(i.text)+'</span></div></div>';
    }).join('') +'</div>';
}

/* ---------------- END-OF-DAY CASH DRAWER / Z-REPORT ---------------- */
function dayCloseFigures(date){
  var daySales = STATE.data.sales.filter(function(s){ return s.date===date; });
  var f = {cashSales:0, cashCreditPayments:0, telebirr:0, cbe:0, bank:0, creditSold:0, totalSales:0, grossProfit:0, discounts:0, salesCount:daySales.length};
  function addDigital(method, amt){ if(method==='telebirr') f.telebirr += amt; else if(method==='cbe') f.cbe += amt; else if(method==='bank') f.bank += amt; }
  STATE.data.sales.forEach(function(s){
    if(saleIsCredit(s)){
      (s.payments||[]).forEach(function(p){
        if(p.date!==date) return;
        var m = p.method||'cash';
        if(m==='cash') f.cashCreditPayments += (p.amount||0); else addDigital(m, p.amount||0);
      });
    } else if(s.date===date){
      var m2 = s.paymentMethod||'cash';
      if(m2==='cash') f.cashSales += (s.totalSales||0); else addDigital(m2, s.totalSales||0);
    }
  });
  daySales.forEach(function(s){
    f.totalSales += (s.totalSales||0); f.grossProfit += (s.grossProfit||0); f.discounts += (s.discount||0);
    if(saleIsCredit(s)) f.creditSold += (s.totalSales||0);
  });
  f.cashExpenses = (STATE.data.expenses||[]).filter(function(e){ return e.date===date; }).reduce(function(a,e){ return a+(e.amount||0); },0);
  f.loansGiven = loansGivenInRange(date,date);
  f.loanRepaymentsCash = loanRepaidInRange(date,date,true);
  Object.keys(f).forEach(function(k){ if(k!=='salesCount') f[k] = round2(f[k]); });
  f.digital = round2(f.telebirr + f.cbe + f.bank);
  return f;
}
function dayCloseRecord(date, inp){
  var f = dayCloseFigures(date);
  var fl = round2(parseFloat(inp.float)||0), out = round2(parseFloat(inp.out)||0);
  var expected = round2(fl + f.cashSales + f.cashCreditPayments + f.loanRepaymentsCash - f.cashExpenses - f.loansGiven - out);
  var hasCount = !(inp.counted===''||inp.counted===null||inp.counted===undefined) && !isNaN(parseFloat(inp.counted));
  var counted = hasCount ? round2(parseFloat(inp.counted)) : null;
  return Object.assign({}, f, {date:date, openingFloat:fl, otherOut:out, expectedCash:expected, countedCash:counted,
    difference: counted===null ? null : round2(counted-expected), notes:inp.notes||''});
}
function diffBadge(diff){
  if(diff===null || diff===undefined) return '<span class="muted">Enter the counted cash</span>';
  if(diff<0) return '<span class="pill pill-red">Shortage · '+fmtETB(-diff)+'</span>';
  if(diff>0) return '<span class="pill pill-green">Overage · '+fmtETB(diff)+'</span>';
  return '<span class="pill pill-blue">Balanced</span>';
}
function zReportHtml(z){
  var u = currentUser() || {};
  var diffTxt = z.difference===null||z.difference===undefined ? '—' : (z.difference<0 ? ('SHORTAGE '+fmtETB(-z.difference)) : (z.difference>0 ? ('OVERAGE '+fmtETB(z.difference)) : 'BALANCED'));
  var line = function(a,b,cls){ return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+a+'</td><td>'+b+'</td></tr>'; };
  return '<div class="zreport">'+
    '<h1>Z-Report — End of Day</h1>'+
    '<div class="z-sub">'+esc(u.shopName||'')+(u.shopAddress?(' · '+esc(u.shopAddress)):'')+'</div>'+
    '<div class="z-sub">Date: <b>'+fmtDateLong(z.date)+'</b> · Printed: '+esc(new Date().toLocaleString())+'</div>'+
    '<h2>Sales</h2><table>'+
      line('Number of sales', z.salesCount)+line('Total sales', fmtETB(z.totalSales))+line('Discounts given', fmtETB(z.discounts))+
      line('Sold on credit', fmtETB(z.creditSold))+line('Gross profit', fmtETB(z.grossProfit))+line('Expenses', fmtETB(z.cashExpenses))+
    '</table>'+
    '<h2>Money received</h2><table>'+
      line('Cash sales', fmtETB(z.cashSales))+line('Cash credit payments', fmtETB(z.cashCreditPayments))+
      line('Telebirr', fmtETB(z.telebirr))+line('CBE Birr', fmtETB(z.cbe))+line('Bank transfer', fmtETB(z.bank))+
    '</table>'+
    '<h2>Cash drawer</h2><table>'+
      line('Opening float', fmtETB(z.openingFloat))+line('+ Cash sales', fmtETB(z.cashSales))+line('+ Cash credit payments', fmtETB(z.cashCreditPayments))+
      line('− Cash expenses', fmtETB(z.cashExpenses))+
      (z.loansGiven ? line('− Cash loans given out', fmtETB(z.loansGiven)) : '')+(z.loanRepaymentsCash ? line('+ Cash loan repayments', fmtETB(z.loanRepaymentsCash)) : '')+
      line('− Other cash taken out', fmtETB(z.otherOut))+
      line('<b>Expected cash</b>', '<b>'+fmtETB(z.expectedCash)+'</b>', 'z-strong')+
      line('<b>Counted cash</b>', '<b>'+(z.countedCash===null||z.countedCash===undefined?'—':fmtETB(z.countedCash))+'</b>', 'z-strong')+
      line('<b>Difference</b>', '<b>'+diffTxt+'</b>', 'z-diff'+(z.difference<0?' neg':(z.difference>0?' pos':'')))+
    '</table>'+
    (z.notes ? '<h2>Notes</h2><p>'+esc(z.notes)+'</p>' : '')+
    '<div class="z-sign"><span>Cashier / Manager: ____________________</span><span>Owner: ____________________</span></div>'+
  '</div>';
}

function renderDayClose(){
  var date = STATE.dayCloseDate || todayStr();
  var saved = (STATE.data.dayCloses||[]).find(function(x){ return x.id===date; });
  var dr = STATE.dayCloseDraft;
  if(!dr || dr.date!==date){
    dr = STATE.dayCloseDraft = saved
      ? {date:date, float:String(saved.openingFloat||''), out:String(saved.otherOut||''), counted:String(saved.countedCash===null||saved.countedCash===undefined?'':saved.countedCash), notes:saved.notes||''}
      : {date:date, float:'', out:'', counted:'', notes:''};
  }
  var z = dayCloseRecord(date, dr);

async function repayLoan(id, amount, dateStr, method){
  var ref = shopRef().collection('cashLoans').doc(id);
  await db.runTransaction(async function(tx){
    var snap = await tx.get(ref);
    if(!snap.exists) throw new Error('This loan no longer exists.');
    var d = snap.data();
    var due = round2((d.amount||0)-(d.repaid||0));
    if(!(amount>0)) throw new Error('Enter an amount greater than 0.');
    if(amount > due + 0.001) throw new Error('That is more than is still owed ('+fmtETB(due)+').');
    var pay = {date:dateStr, amount:amount, method:method||'cash', byUid:STATE.session.userId};
    tx.update(ref, {repaid: round2((d.repaid||0)+amount), payments:(d.payments||[]).concat([pay])});
  });
}
async function undoLoanPayment(id, idx){
  var ref = shopRef().collection('cashLoans').doc(id);
  await db.runTransaction(async function(tx){
    var snap = await tx.get(ref);
    if(!snap.exists) throw new Error('This loan no longer exists.');
    var d = snap.data(), pays = (d.payments||[]).slice(), p = pays[idx];
    if(!p) throw new Error('That repayment was not found — refresh and try again.');
    pays.splice(idx,1);
    tx.update(ref, {repaid: round2(Math.max(0,(d.repaid||0)-(p.amount||0))), payments:pays});
  });
}

/* ---- PDF: Amharic (Ethiopic) text ----
   jsPDF's built-in fonts have no Ethiopic letters, so any text containing Amharic is drawn with an
   embedded Noto Sans Ethiopic (Latin + Ethiopic). The font is only added to a PDF that needs it. */
var ETH_RE = /[\u1200-\u139F\u2D80-\u2DDF\uAB00-\uAB2F]/;
var ETH_FONT_B64 = null;
function ensureEthiopicFont(doc){
  if(doc.__ethReady) return;
  if(ETH_FONT_B64===null){
    var el = document.getElementById('fontEthiopic');
    ETH_FONT_B64 = el ? el.textContent.replace(/\s+/g,'') : '';
  }
  if(!ETH_FONT_B64) return;
  doc.addFileToVFS('NotoSansEthiopic.ttf', ETH_FONT_B64);
  doc.addFont('NotoSansEthiopic.ttf','NotoEthiopic','normal');
  doc.addFont('NotoSansEthiopic.ttf','NotoEthiopic','bold');
  doc.__ethReady = true;
}
/* set the right font for a piece of text; falls back to the given built-in font */
function pdfSetFont(doc, text, baseFont, baseStyle){
  if(ETH_RE.test(String(text))){ ensureEthiopicFont(doc); }
  if(doc.__ethReady && ETH_RE.test(String(text))) doc.setFont('NotoEthiopic','normal');
  else doc.setFont(baseFont, baseStyle);
}
/* doc.text that switches to the Ethiopic font only for that one string, then restores */
function ptxt(doc, text, x, y, opts){
  var prev = doc.getFont();
  var t = String(text);
  if(ETH_RE.test(t)){ ensureEthiopicFont(doc); if(doc.__ethReady) doc.setFont('NotoEthiopic','normal'); }
  doc.text(t, x, y, opts);
  doc.setFont(prev.fontName, prev.fontStyle);
}
function ethCell(data){
  var t = (data.cell && data.cell.text) ? data.cell.text.join(' ') : '';
  if(ETH_RE.test(t)){
    ensureEthiopicFont(data.doc);
    if(data.doc.__ethReady){ data.cell.styles.font = 'NotoEthiopic'; data.cell.styles.fontStyle = 'normal'; }
  }
}

/* ---------------- FULL BACKUP & RESTORE ---------------- */
var BACKUP_COLLECTIONS = ['products','sales','stockPurchases','expenses','invoices','backupSavings','branches','dayCloses','cashLoans','txIds'];
var BACKUP_PROFILE_FIELDS = ['shopName','shopAddress','shopPhone','dailyGoal','weeklyGoal','monthlyGoal','yearlyGoal','weeklyStockBudget','monthlyStockBudget','backupSavingEnabled','colorPalette'];

async function buildBackup(){
  var base = shopRef();
  var out = {app:'Taza DSR', version:1, exportedAt:new Date().toISOString(), shopId:STATE.session.shopId, counts:{}, profile:{}, collections:{}};
  var prof = STATE.shopProfile || {};
  BACKUP_PROFILE_FIELDS.forEach(function(k){ if(prof[k]!==undefined) out.profile[k] = prof[k]; });
  for(var i=0;i<BACKUP_COLLECTIONS.length;i++){
    var name = BACKUP_COLLECTIONS[i];
    var snap = await base.collection(name).get();
    out.collections[name] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    out.counts[name] = out.collections[name].length;
  }
  return out;
}
function downloadTextFile(name, text, mime){
  var a = document.createElement('a');
  a.download = name;
  try{
    a.href = URL.createObjectURL(new Blob([text], {type:mime}));
  }catch(e){
    a.href = 'data:'+mime+';charset=utf-8,'+encodeURIComponent(text);
  }
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} if(a.parentNode) a.parentNode.removeChild(a); }, 2000);
}
async function doBackupDownload(){
  toast('Preparing your backup…','info');
  try{
    var data = await buildBackup();
    var total = BACKUP_COLLECTIONS.reduce(function(a,k){ return a+data.counts[k]; },0);
    var u = currentUser() || {};
    var stamp = todayStr();
    downloadTextFile('taza-dsr-backup-'+stamp+'.json', JSON.stringify(data), 'application/json');
    toast('Backup downloaded — '+total+' records.','success');
  }catch(err){ showActionError(err); }
}
/* A backup file is checked before a single record is written. */
function validateBackup(obj){
  if(!obj || typeof obj!=='object' || obj.app!=='Taza DSR' || !obj.collections || typeof obj.collections!=='object') return {ok:false, error:'This is not a Taza DSR backup file.'};
  var total = 0, counts = {};
  for(var i=0;i<BACKUP_COLLECTIONS.length;i++){
    var name = BACKUP_COLLECTIONS[i], arr = obj.collections[name];
    if(arr===undefined){ counts[name]=0; continue; }
    if(!Array.isArray(arr)) return {ok:false, error:'The backup is damaged ('+name+' is not a list).'};
    for(var j=0;j<arr.length;j++){
      var it = arr[j];
      if(!it || typeof it!=='object' || typeof it.id!=='string' || !/^[A-Za-z0-9_-]{1,128}$/.test(it.id)) return {ok:false, error:'The backup is damaged (a record in '+name+' has an invalid id).'};
    }
    counts[name] = arr.length; total += arr.length;
  }
  if(total>60000) return {ok:false, error:'The backup is too large to restore in one go.'};
  return {ok:true, counts:counts, total:total};
}
function cleanRecord(item){
  var d = {};
  Object.keys(item).forEach(function(k){ if(k!=='id' && !/^__.*__$/.test(k)) d[k] = item[k]; });
  return d;
}
async function restoreBackup(obj){
  var base = shopRef();
  var existingTx = {};
  (await base.collection('txIds').get()).docs.forEach(function(d){ existingTx[d.id] = 1; });
  var ops = [];
  BACKUP_COLLECTIONS.forEach(function(name){
    (obj.collections[name]||[]).forEach(function(item){
      if(name==='txIds' && existingTx[item.id]) return;   /* a transaction ID can only be created once */
      ops.push({ref: base.collection(name).doc(item.id), data: cleanRecord(item)});
    });
  });
  for(var i=0;i<ops.length;i+=400){
    var b = db.batch();
    ops.slice(i, i+400).forEach(function(op){ b.set(op.ref, op.data); });
    await b.commit();
  }
  var prof = {};
  BACKUP_PROFILE_FIELDS.forEach(function(k){ if(obj.profile && obj.profile[k]!==undefined && k!=='shopName') prof[k] = obj.profile[k]; });
  if(Object.keys(prof).length){ await base.update(prof); }
  return ops.length;
}
function onRestoreFile(ev){
  var input = ev.target, file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onerror = function(){ alert('Could not read that file.'); input.value=''; };
  reader.onload = function(){
    input.value = '';
    var obj;
    try{ obj = JSON.parse(String(reader.result)); }catch(e){ alert('That file is not a valid backup (it could not be read as JSON).'); return; }
    var v = validateBackup(obj);
    if(!v.ok){ alert(v.error); return; }
    var labels = {products:'products', sales:'sales', stockPurchases:'stock purchases', expenses:'expenses', invoices:'invoices', backupSavings:'saving entries', branches:'branches', dayCloses:'day closings', cashLoans:'cash loans', txIds:'transaction IDs'};
    askConfirm({
      title:'Restore this backup?', confirmText:'Restore',
      details:[ 'Backup made on '+(obj.exportedAt?fmtDateLong(String(obj.exportedAt).slice(0,10)):'an unknown date')+' — '+v.total+' records.' ]
        .concat(BACKUP_COLLECTIONS.filter(function(k){ return v.counts[k]>0; }).map(function(k){ return v.counts[k]+' '+labels[k]; }))
        .concat(['Records with the same ID are replaced by the backup version. Records that are not in the backup stay as they are.'])
    }).then(function(ok){
      if(!ok) return;
      toast('Restoring…','info');
      restoreBackup(obj).then(function(n){ toast('Restore finished — '+n+' records written.','success'); }).catch(showActionError);
    });
  };
  reader.readAsText(file);
}

function receiptTime(iso){

/* A receipt for one or several sales recorded together. */
function saleReceiptModel(sales){
  var first = sales[0] || {};
  var items = sales.map(function(s){ return {name:s.productName, qty:s.quantity, unitPrice:s.sellingPrice, lineTotal:round2(s.quantity*s.sellingPrice)}; });
  var sum = function(fn){ return round2(sales.reduce(function(a,s){ return a+fn(s); },0)); };
  return {
    invoiceNo: 'S-'+String(first.id||'').slice(-5).toUpperCase(),
    customerName: first.isCredit ? (first.customerName||'') : '', phone: first.isCredit ? (first.customerPhone||'') : '',
    items: items, subtotal: sum(function(s){ return s.quantity*s.sellingPrice; }), discount: sum(function(s){ return s.discount||0; }),
    total: sum(function(s){ return s.totalSales||0; }), paymentMethod: first.paymentMethod||'cash',
    createdAt: first.createdAt || new Date().toISOString(), showTime:true,
    paid: sum(saleCollected), balance: sum(saleBalanceDue)
  };
}
/* Print any piece of HTML on its own (receipts, Z-report) without touching the screen underneath. */
function printHtml(inner, fmt){
  var old = document.getElementById('printTemp'); if(old && old.parentNode) old.parentNode.removeChild(old);
  var host = document.createElement('div');
  host.id = 'printTemp'; host.innerHTML = inner;
  document.body.appendChild(host);
  applyPrintPageStyle(fmt);
  var cleaned = false;
  function cleanup(){ if(cleaned) return; cleaned = true; window.removeEventListener('afterprint', cleanup); if(host.parentNode) host.parentNode.removeChild(host); }
  window.addEventListener('afterprint', cleanup);
  setTimeout(cleanup, 120000);
  setTimeout(function(){ try{ window.print(); }catch(e){ cleanup(); } }, 60);
}

function applyPrintPageStyle(fmt){
  var el = document.getElementById('printPageStyle');
  if(!el){ el = document.createElement('style'); el.id = 'printPageStyle'; document.head.appendChild(el); }
  el.textContent = fmt==='a4' ? '@page{size:A4;margin:15mm;}' : '@page{size:'+(fmt==='58'?'58mm':'80mm')+' auto;margin:2mm;}';
}

/* A real thermal-roll PDF: page width = paper width, page height = exactly as long as the receipt. */
function exportThermalPDF(inv, widthMm){
  if(typeof window.jspdf === 'undefined'){ alert('PDF export library failed to load. Check your connection and try again.'); return; }
  var shop = currentUser() || {};
  var W = widthMm, margin = 3, inner = W - margin*2;
  var base = widthMm===58 ? 7 : 8;
  function draw(doc){
    var y = margin + 3;
    function lh(size){ return size*0.43; }
    function center(text,size,bold){
      pdfSetFont(doc, text, 'courier', bold?'bold':'normal'); doc.setFontSize(size);
      doc.splitTextToSize(String(text), inner).forEach(function(p){ doc.text(p, W/2, y, {align:'center'}); y += lh(size); });
    }
    function row(l,r,size,bold){
      doc.setFontSize(size);
      pdfSetFont(doc, l, 'courier', bold?'bold':'normal'); doc.text(String(l), margin, y);
      pdfSetFont(doc, r, 'courier', bold?'bold':'normal'); doc.text(String(r), W-margin, y, {align:'right'}); y += lh(size);
    }
    function sep(dashed){
      doc.setDrawColor(0); doc.setLineWidth(0.2);
      if(dashed && doc.setLineDash) doc.setLineDash([0.8,0.8],0);
      doc.line(margin, y-1.2, W-margin, y-1.2);
      if(doc.setLineDash) doc.setLineDash([]);
      y += 1.4;
    }
    center(shop.shopName||'Shop', base+3, true);
    if(shop.shopAddress) center(shop.shopAddress, base-1, false);
    if(shop.shopPhone) center('Tel: '+shop.shopPhone, base-1, false);
    sep(false);
    row('Receipt', inv.invoiceNo||'', base, false);
    row('Date', fmtDateLong((inv.createdAt||new Date().toISOString()).slice(0,10)), base, false);
    if(inv.showTime) row('Time', receiptTime(inv.createdAt), base, false);
    if(inv.customerName) row('Customer', inv.customerName, base, false);
    if(inv.phone) row('Phone', inv.phone, base, false);
    sep(true);
    inv.items.forEach(function(it){
      var lt = it.lineTotal!==undefined ? it.lineTotal : round2(it.qty*it.unitPrice);
      pdfSetFont(doc, it.name, 'courier', 'normal'); doc.setFontSize(base);
      doc.splitTextToSize(String(it.name), inner).forEach(function(p){ doc.text(p, margin, y); y += lh(base); });
      row('  '+it.qty+' x '+fmtNum(it.unitPrice), fmtNum(lt), base, false);
    });
    sep(true);
    if((inv.discount||0)>0){ row('Subtotal', fmtNum(inv.subtotal||round2(inv.total+inv.discount)), base, false); row('Discount', '-'+fmtNum(inv.discount), base, false); }
    row('TOTAL', fmtNum(inv.total)+' ETB', base+2, true);
    row('Paid by', payLabel(inv.paymentMethod), base, false);
    if((inv.balance||0)>0){ row('Paid now', fmtNum(inv.paid||0), base, false); row('BALANCE DUE', fmtNum(inv.balance), base+1, true); }
    sep(false);
    center('Thank you! Come again.', base, false);
    center('Taza Technology', base-1, false);
    return y + margin;
  }
  var probe = new window.jspdf.jsPDF({unit:'mm', format:[W, 1200]});
  var height = Math.max(W+20, Math.ceil(draw(probe)));   /* always taller than wide, or jsPDF would rotate the page */
  var doc = new window.jspdf.jsPDF({unit:'mm', format:[W, height]});
  draw(doc);
  doc.save((inv.invoiceNo||'receipt')+'-'+W+'mm.pdf');
}

function renderBudgetCard(label, used, budget){
  if(!budget || budget<=0) return '';
  var remaining = round2(budget - used);
  var pct = Math.min(100, round2((used/budget)*100));
  var over = used > budget;
  return '<div class="card" style="margin-bottom:16px;">'+
    '<div class="goal-label"><span>'+esc(label)+'</span><b>'+fmtETB(used)+' / '+fmtETB(budget)+'</b></div>'+
    '<div class="progress-track"><div class="progress-fill'+(over?' over':'')+'" style="width:'+pct+'%;'+(over?'background:var(--red);':'')+'"></div></div>'+
    '<div class="stat-sub" style="margin-top:6px;'+(over?'color:var(--red);font-weight:700;':'')+'">'+
      (over ? ('Over budget by '+fmtETB(Math.abs(remaining))) : (fmtETB(remaining)+' remaining'))+
    '</div>'+
  '</div>';
}

var SP_LABELS = {daily:'Daily', weekly:'Weekly', monthly:'Monthly', yearly:'Yearly', custom:'Custom'};
function spReportRange(r){
  var ref = parseISO(r.date || todayStr());
  if(r.period==='daily') return {from:isoDate(ref), to:isoDate(ref)};
  if(r.period==='weekly'){ var s = startOfWeek(ref); return {from:isoDate(s), to:isoDate(addDays(s,6))}; }
  if(r.period==='monthly') return {from:isoDate(new Date(ref.getFullYear(), ref.getMonth(), 1)), to:isoDate(new Date(ref.getFullYear(), ref.getMonth()+1, 0))};
  if(r.period==='yearly') return {from:ref.getFullYear()+'-01-01', to:ref.getFullYear()+'-12-31'};
  var a = r.from || todayStr(), b = r.to || todayStr();
  return a<=b ? {from:a, to:b} : {from:b, to:a};
}

function reportRangeDates(){
  var t = new Date();
  var r = STATE.reportRange;
  if(r==='today') return {from:todayStr(), to:todayStr()};
  if(r==='yesterday'){ var y=addDays(t,-1); return {from:isoDate(y),to:isoDate(y)}; }
  if(r==='week') return {from:isoDate(startOfWeek(t)), to:todayStr()};
  if(r==='month') return {from:isoDate(startOfMonth(t)), to:todayStr()};
  if(r==='year') return {from:isoDate(startOfYear(t)), to:todayStr()};
  if(r==='custom') return {from:STATE.reportCustomFrom, to:STATE.reportCustomTo};
  return {from:todayStr(),to:todayStr()};
}

function renderTopProductLists(salesInR){
  var agg = {};
  salesInR.forEach(function(s){
    if(!agg[s.productId]) agg[s.productId] = {name:s.productName, qty:0, revenue:0, cogs:0, profit:0};
    agg[s.productId].qty += s.quantity;
    agg[s.productId].revenue += s.totalSales;
    agg[s.productId].cogs += s.cogs;
    agg[s.productId].profit += s.grossProfit;
  });
  var list = Object.keys(agg).map(function(k){ return agg[k]; });
  var topSelling = list.slice().sort(function(a,b){return b.qty-a.qty;}).slice(0,10);
  var topProfit = list.slice().sort(function(a,b){return b.profit-a.profit;}).slice(0,10);

  function rankedList(items, valueKey, subLabel){
    if(!items.length) return '<div class="muted">No sales in this range.</div>';
    return items.map(function(it,i){
      var perUnit = it.qty>0 ? round2(it.profit/it.qty) : 0;
      return '<div class="list-item"><span><b style="color:var(--gold-dark);">#'+(i+1)+'</b> '+esc(it.name)+
        '<br><span class="muted" style="font-size:10.5px;">qty '+it.qty+(subLabel==='profit'?(' · '+fmtETB(perUnit)+' per unit'):'')+'</span></span>'+
        '<b>'+fmtETB(it[valueKey])+'</b></div>';
    }).join('');
  }

  return '<div class="section-title" style="margin-top:26px;">'+uiIcon('award','icon-sm')+' Top Products</div>'+
    '<div class="two-col">'+
      '<div class="card"><h3 style="margin-bottom:10px;">Top 10 Selling Products <span class="muted" style="font-weight:600;">(by quantity)</span></h3>'+rankedList(topSelling,'revenue','qty')+'</div>'+
      '<div class="card"><h3 style="margin-bottom:10px;">Top 10 Highest-Profit Products</h3>'+rankedList(topProfit,'profit','profit')+'</div>'+
    '</div>';
}

function buildTrendBuckets(fromStr, toStr){
  var fromD = parseISO(fromStr), toD = parseISO(toStr);
  var spanDays = Math.round((toD-fromD)/86400000)+1;
  var byMonth = spanDays > 45;
  var buckets = {}, order = [];
  if(byMonth){
    var cursor = new Date(fromD.getFullYear(), fromD.getMonth(), 1);
    while(cursor <= toD){
      var key = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1);
      order.push(key); buckets[key] = {sales:0, profit:0};
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    }
  } else {
    var c2 = new Date(fromD);
    while(c2 <= toD){
      var key2 = isoDate(c2);
      order.push(key2); buckets[key2] = {sales:0, profit:0};
      c2 = addDays(c2,1);
    }
  }
  salesInRange(fromStr,toStr).forEach(function(s){
    var key = byMonth ? s.date.slice(0,7) : s.date;
    if(buckets[key]){ buckets[key].sales += s.totalSales; buckets[key].profit += s.grossProfit; }
  });
  return {
    labels: order.map(function(k){ return byMonth ? k : k.slice(5); }),
    sales: order.map(function(k){ return round2(buckets[k].sales); }),
    profit: order.map(function(k){ return round2(buckets[k].profit); })
  };
}

var REPORT_CHART = null;
function renderReportChart(){
  var canvas = document.getElementById('reportTrendChart');
  if(!canvas || typeof Chart === 'undefined') return;
  var range = reportRangeDates();
  var data = buildTrendBuckets(range.from, range.to);
  if(REPORT_CHART){ REPORT_CHART.destroy(); REPORT_CHART = null; }
  REPORT_CHART = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: data.labels,
      datasets: [
        {label:'Sales', data:data.sales, backgroundColor:'#0e7c72'},
        {label:'Gross Profit', data:data.profit, backgroundColor:'#c9a227'}
      ]
    },
    options: {
      responsive:true,
      plugins:{ legend:{position:'bottom'} },
      scales:{ y:{ beginAtZero:true } }
    }
  });
}

/* ---------------- MODAL ---------------- */
var SCAN_STREAM = null;
function stopScan(){
  if(SCAN_STREAM){
    SCAN_STREAM.getTracks().forEach(function(t){ t.stop(); });
    SCAN_STREAM = null;
  }
}
async function startBarcodeScan(){
  var video = document.getElementById('scanVideo');
  var statusEl = document.getElementById('scanStatus');
  if(!video) return;
  try{
    var stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    SCAN_STREAM = stream;
    video.srcObject = stream;
    var detector = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
    function tick(){
      if(!SCAN_STREAM) return;
      detector.detect(video).then(function(codes){
        if(codes && codes.length){
          var value = codes[0].rawValue;
          stopScan();
          STATE.modal = null;
          var match = STATE.data.products.find(function(p){ return p.barcode && p.barcode.toLowerCase()===value.toLowerCase(); });
          if(match){ STATE.quickSaleSelectedId = match.id; STATE.quickSaleQuery=''; }
          else { STATE.quickSaleQuery = value; }
          render();
          if(!match){ setTimeout(function(){ alert('No product matches barcode '+value+' yet. You can add it under this product\'s Barcode field in Products.'); }, 50); }
          return;
        }
        requestAnimationFrame(tick);
      }).catch(function(){ requestAnimationFrame(tick); });
    }
    requestAnimationFrame(tick);
  }catch(err){
    if(statusEl) statusEl.textContent = 'Could not access the camera: '+((err&&err.message)||err);
  }
}

/* On a phone a wide table becomes a stack of cards: every cell is tagged with its column title. */
function labelTables(){
  document.querySelectorAll('.table-wrap table').forEach(function(t){
    var heads = Array.prototype.map.call(t.querySelectorAll('thead th'), function(th){ return th.textContent.trim(); });
    t.classList.add('stackable');
    t.querySelectorAll('tbody tr').forEach(function(tr){
      Array.prototype.forEach.call(tr.children, function(td, i){ if(heads[i]) td.setAttribute('data-label', heads[i]); });
    });
  });
}

/* The whole screen is redrawn after many keystrokes. render() now remembers which field you were typing in,
   what it contained and exactly where the cursor was, and puts all three back — so you can edit in the
   middle of a word. (This function is kept only because older call sites still call it.) */
function preserveFocus(id){}
function captureFocus(){
  var ae = document.activeElement, root = document.getElementById('app');
  if(!ae || !/^(INPUT|TEXTAREA)$/.test(ae.tagName) || !root || !root.contains(ae)) return null;
  /* a field is found again by its id, or by (form id + field name) when it has no id of its own */
  var key = ae.id ? {id:ae.id} : ((ae.name && ae.form && ae.form.id) ? {form:ae.form.id, name:ae.name} : null);
  if(!key) return null;
  var snap = {key:key, type:(ae.type||'').toLowerCase(), value:ae.value, start:null, end:null, dir:'none'};
  try{ snap.start = ae.selectionStart; snap.end = ae.selectionEnd; snap.dir = ae.selectionDirection || 'none'; }catch(e){}
  return snap;
}
function restoreFocus(snap){
  if(!snap) return;
  var el = null;
  if(snap.key.id) el = document.getElementById(snap.key.id);
  else { var fm = document.getElementById(snap.key.form); el = fm && fm.elements ? fm.elements[snap.key.name] : null; }
  if(!el || el.length!==undefined && el.tagName===undefined) return;   /* a group of radio buttons — nothing to restore */
  var textual = (el.tagName==='TEXTAREA') || /^(text|search|tel|url|email|password|)$/.test(snap.type);
  var skipValue = /^(checkbox|radio|file|button|submit|reset|hidden)$/.test(snap.type);
  /* while typing: keep what was typed in text boxes; when live data arrives: keep it in every kind of box */
  if(!skipValue && (textual || STATE._liveRender) && el.value !== snap.value) el.value = snap.value;
  try{ el.focus(); }catch(e){}
  if(snap.start!==null && snap.start!==undefined){ try{ el.setSelectionRange(snap.start, snap.end, snap.dir); }catch(e){} }
}
/* mark renders that happen inside a typing event, or because live data arrived */
document.addEventListener('input', function(){ STATE._inInput = true; }, true);
document.addEventListener('input', function(){ STATE._inInput = false; }, false);
/* Typing must never replace the box you are typing in (phone keyboards — especially Amharic — lose their place
   when that happens and the cursor jumps). So typing only updates the parts that depend on it. */
function bindBulkTx(){
  var el = document.getElementById('bulkSaleTx');
  if(el && !el.__txBound){ el.__txBound = true; el.addEventListener('input', function(){ STATE.bulkSaleDraft.txId = el.value; }); }
}
function refreshRegions(ids, structural){
  var tpl = document.createElement('div');
  tpl.innerHTML = translateUI(renderView());
  ids.forEach(function(id){
    var fresh = tpl.querySelector('#'+id), cur = document.getElementById(id);
    if(fresh && cur && cur.innerHTML !== fresh.innerHTML) cur.innerHTML = fresh.innerHTML;
  });
  /* if a field has to appear or disappear, redraw once (the focus is restored as a fallback) */
  var must = (structural||[]).some(function(id){ return !!document.getElementById(id) !== !!tpl.querySelector('#'+id); });
  if(must){ render(); return; }
  labelTables(); bindBulkTx();
}
function isEditingField(){
  var ae = document.activeElement, root = document.getElementById('app');
  if(!ae || !root || !root.contains(ae)) return false;
  if(ae.tagName==='TEXTAREA' || ae.tagName==='SELECT') return true;
  return ae.tagName==='INPUT' && !/^(button|submit|checkbox|radio|reset|file|hidden)$/.test((ae.type||'').toLowerCase());
}
/* New data from Firebase arrives all the time. While you are typing it waits, and is applied the moment you leave the field. */
function renderLive(){
  if(isEditingField()){ STATE._renderPending = true; return; }
  STATE._liveRender = true; try{ render(); } finally{ STATE._liveRender = false; }
}
document.addEventListener('focusout', function(){
  if(!STATE._renderPending) return;
  setTimeout(function(){ if(STATE._renderPending && !isEditingField()){ STATE._renderPending = false; renderLive(); } }, 80);
}, true);

function handleAction(act, el, ev){
  if(act==='tab-login'){ STATE.authTab='login'; STATE.authError=''; render(); return; }
  if(act==='tab-signup'){ STATE.authTab='signup'; STATE.authError=''; render(); return; }
  if(act==='forgot'){ STATE.forgotMode=true; STATE.authError=''; STATE.authMsg=''; render(); return; }
  if(act==='back-to-login'){ STATE.forgotMode=false; STATE.authError=''; STATE.authMsg=''; render(); return; }
  if(act==='logout'){ clearLockFlag(); auth.signOut(); return; }
  if(act==='lock-now'){ lockNow(false); return; }
  if(act==='resend-verify'){
    if(auth.currentUser){
      auth.currentUser.sendEmailVerification().then(function(){ alert('Verification email sent — check your inbox.'); }).catch(function(err){ showActionError(err); });
    }
    return;
  }
  if(act==='toggle-backup-saving'){
    var cur = !!(STATE.shopProfile && STATE.shopProfile.backupSavingEnabled);
    shopRef().update({backupSavingEnabled: !cur}).then(function(){
      STATE.shopProfile = Object.assign({}, STATE.shopProfile, {backupSavingEnabled: !cur});
      render();
    }).catch(showActionError);
    return;
  }
  if(act==='toggle-branch'){
    var bId = el.getAttribute('data-id');
    var br = (STATE.data.branches||[]).find(function(x){return x.id===bId;});
    if(br){ shopRef().collection('branches').doc(bId).update({status: br.status==='inactive'?'active':'inactive'}).catch(showActionError); }
    return;
  }
  if(act==='edit-branch'){
    var ebr = (STATE.data.branches||[]).find(function(x){return x.id===el.getAttribute('data-id');});
    STATE.modal={type:'editBranch', data:Object.assign({},ebr)}; render(); return;
  }
  if(act==='toggle-staff'){
    var sId = el.getAttribute('data-id');

/* ---------------- FORM HANDLERS ---------------- */
async function onLogin(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);
  var email = fd.get('email').trim().toLowerCase();
  var password = fd.get('password');
  STATE.authError=''; STATE.authBusy=true; render();
  try{
    await auth.signInWithEmailAndPassword(email, password);
    /* onAuthStateChanged takes it from here */
  }catch(err){
    STATE.authError = friendlyAuthError(err);
    STATE.authBusy = false;
    render();
  }
}

async function onSignup(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);
  var shopName=fd.get('shopName').trim(), ownerName=fd.get('ownerName').trim();
  var email=fd.get('email').trim().toLowerCase();
  var password=fd.get('password'), confirmPassword=fd.get('confirmPassword');
  if(password!==confirmPassword){ STATE.authError='Passwords do not match.'; render(); return; }
  STATE.authError=''; STATE.authBusy=true; render();
  try{
    var cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('shops').doc(cred.user.uid).set({
      shopName:shopName, ownerName:ownerName, email:email, createdAt:new Date().toISOString()
    });
    await db.collection('staffLookup').doc(cred.user.uid).set({shopId:cred.user.uid, role:'ceo', branchId:null, status:'active'});
    await db.collection('shops').doc(cred.user.uid).collection('staff').doc(cred.user.uid).set({
      name:ownerName, email:email, role:'ceo', branchId:null, status:'active', createdAt:new Date().toISOString()
    });
    try{ await cred.user.sendEmailVerification(); }catch(e){ /* non-fatal */ }
    /* onAuthStateChanged takes it from here */
  }catch(err){
    STATE.authError = friendlyAuthError(err);
    STATE.authBusy = false;
    render();
  }
}

async function onResetPassword(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);
  var email = fd.get('email').trim().toLowerCase();
  var btn = ev.target.querySelector('button[type=submit]');
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  STATE.authError=''; STATE.authMsg='';
  try{
    await auth.sendPasswordResetEmail(email);
    STATE.authMsg = 'Reset email sent — check your inbox (and spam folder). It can take a minute to arrive.';
  }catch(err){
    var msg = friendlyAuthError(err);
    if(err && err.code === 'auth/network-request-failed'){
      msg += ' This usually means your device lost connection right as the request was sent — try switching between Wi-Fi and mobile data, then tap Send again.';
    }
    STATE.authError = msg;
  }
  render();
}

async function onQuickSale(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);
  var mode = ev.target.getAttribute('data-mode');
  var qty = parseFloat(fd.get('quantity'));
  var costPrice = parseFloat(fd.get('costPrice'));
  var sellingPrice = parseFloat(fd.get('sellingPrice'));
  var date = fd.get('date');
  var productId, productName;
  var submitBtn = ev.target.querySelector('button[type=submit]');
  if(submitBtn) submitBtn.disabled = true;
  try{
    /* ---- payment details, validated BEFORE anything is saved ---- */
    var payMethod = fd.get('paymentMethod') || 'cash';
    var txIdIn = (fd.get('txId')||'').trim();
    var wantsCredit = canManage() && fd.get('creditSale')==='on';
    var discount = Math.max(0, round2(parseFloat(fd.get('discount'))||0));
    var grossAmt = round2(qty*sellingPrice);
    if(discount>grossAmt) throw new Error('Discount cannot be more than the price ('+fmtETB(grossAmt)+').');
    var totalAmt = round2(grossAmt-discount);
    var paidNow = wantsCredit ? round2(parseFloat(fd.get('paidNow'))||0) : totalAmt;
    var creditInfo = null;
    if(wantsCredit){
      var cName = (fd.get('customerName')||'').trim();
      var dueD = fd.get('dueDate');
      if(!cName) throw new Error('Enter the customer name for a credit sale.');
      if(!dueD) throw new Error('Pick the date the customer will pay by.');
      if(paidNow<0 || paidNow>totalAmt) throw new Error('"Paid now" must be between 0 and '+fmtETB(totalAmt)+'.');
      creditInfo = {customerName:cName, customerPhone:(fd.get('customerPhone')||'').trim(), dueDate:dueD};
    }
    var payingNow = wantsCredit ? paidNow>0 : true;
    if(payMethod!=='cash' && payingNow){
      if(!txKey(txIdIn)) throw new Error('Enter the '+payLabel(payMethod)+' transaction ID.');
      if(await txIdTaken(txIdIn)) throw dupTxError();
    }
    var salePay = {paymentMethod:payMethod, txId:(payMethod!=='cash' && payingNow) ? txIdIn : ''};
    if(wantsCredit){
      Object.assign(salePay, creditInfo, {
        isCredit:true, amountPaid:paidNow,
        payments: paidNow>0 ? [{date:date, amount:paidNow, method:payMethod, txId:salePay.txId, byUid:STATE.session.userId, txClaim:!!salePay.txId}] : []
      });
    }
    if(mode==='new'){
      var name = (fd.get('newProductName')||'').trim();
      var existing = STATE.data.products.find(function(p){ return p.name.toLowerCase()===name.toLowerCase(); });
      if(existing){
        productId = existing.id; productName = existing.name;
        await saveProductDoc({costPrice:costPrice, sellingPrice:sellingPrice}, productId);
      } else {
        var newRef = shopRef().collection('products').doc();
        await newRef.set({
          name:name, category:(fd.get('newProductCategory')||'').trim(),
          costPrice:costPrice, sellingPrice:sellingPrice,
          openingStock:qty, currentStock:qty, reorderLevel:0
        });

async function onBulkSaleSubmit(ev){
  ev.preventDefault();
  var d = STATE.bulkSaleDraft;
  var date = d.date || todayStr();
  var markedOwed = !!d.markedOwed;
  var payMethod = d.paymentMethod || 'cash';
  var validRows = d.rows.filter(function(r){ return (r.name||'').trim() && (r.qty||0)>0; });
  if(!validRows.length){ alert('Add at least one item with a name and quantity.'); return; }

  /* ---- everything is validated BEFORE anything is saved ---- */
  var rowTotal = function(r){ return round2((r.qty||0)*(r.sellingPrice||0)); };
  var grossBatch = round2(validRows.reduce(function(a,r){ return a+rowTotal(r); },0));
  var batchDiscount = Math.max(0, round2(parseFloat(d.discount)||0));
  if(batchDiscount>grossBatch){ alert('Discount cannot be more than the total ('+fmtETB(grossBatch)+').'); return; }
  var batchTotal = round2(grossBatch - batchDiscount);
  /* share the discount across the items in proportion to their price (the last item takes the rounding) */
  var rowDisc = [], usedDisc = 0;
  validRows.forEach(function(r,i){
    var share = (i===validRows.length-1) ? round2(batchDiscount-usedDisc) : (grossBatch>0 ? round2(batchDiscount*rowTotal(r)/grossBatch) : 0);
    rowDisc.push(share); usedDisc = round2(usedDisc+share);
  });
  var rowNet = function(i){ return round2(rowTotal(validRows[i]) - rowDisc[i]); };
  var wantsCredit = canManage() && !!d.credit;
  var paidNow = wantsCredit ? round2(parseFloat(d.paidNow)||0) : batchTotal;
  var credit = null;
  if(wantsCredit){
    var cName = (d.customerName||'').trim();
    if(!cName){ alert('Enter the customer name for a credit sale.'); return; }
    if(!d.dueDate){ alert('Pick the date the customer will pay by.'); return; }
    if(paidNow<0 || paidNow>batchTotal){ alert('"Paid now" must be between 0 and '+fmtETB(batchTotal)+'.'); return; }
    credit = {customerName:cName, customerPhone:(d.customerPhone||'').trim(), dueDate:d.dueDate};
  }
  var needsTx = payMethod!=='cash' && (wantsCredit ? paidNow>0 : true);
  var batchTx = needsTx ? (d.txId||'').trim() : '';
  /* after a half-finished save the ID is already registered by the rows that did save */
  var claimDone = !!(d.claimedTx && batchTx && txKey(d.claimedTx)===txKey(batchTx));
  if(needsTx){
    if(!txKey(batchTx)){ alert('Enter the '+payLabel(payMethod)+' transaction ID.'); return; }
    if(!claimDone){
      try{ if(await txIdTaken(batchTx)){ showActionError(dupTxError()); return; } }catch(e){ showActionError(e); return; }
    }
  }
  if(!canManage()){
    var missing = validRows.filter(function(r){
      return !STATE.data.products.some(function(p){ return p.name.toLowerCase()===r.name.trim().toLowerCase(); });
    }).map(function(r){ return r.name.trim(); });
    if(missing.length){
      alert('These are not in the Products list yet: '+missing.join(', ')+'. Ask a manager to add them first. Nothing was saved.');
      return;
    }
  }

  var submitBtn = ev.target.querySelector('button[type=submit]');
  if(submitBtn) submitBtn.disabled = true;
  var saved = 0, remainingPaid = paidNow, soldList = [];
  try{
    for(var i=0;i<validRows.length;i++){
      var r = validRows[i];
      var name = r.name.trim();
      var existing = STATE.data.products.find(function(p){ return p.name.toLowerCase()===name.toLowerCase(); });
      var productId, productName;
      if(existing){
        productId = existing.id; productName = existing.name;
        if(!canManage()){ r = Object.assign({}, r, {costPrice: existing.costPrice||0}); }
      } else {
        var newRef = shopRef().collection('products').doc();
        await newRef.set({
          name:name, category:'', costPrice:r.costPrice||0, sellingPrice:r.sellingPrice||0,
          openingStock:r.qty, currentStock:r.qty, debt:0, reorderLevel:0
        });
        productId = newRef.id; productName = name;
      }
      /* how much of the payment lands on this row (credit: first rows first) */
      var rowPaid = wantsCredit ? round2(Math.min(rowNet(i), remainingPaid)) : rowNet(i);
      var payHere = needsTx && rowPaid>0;
      var claimThis = payHere && !claimDone;
      var sale = {
        date: date, productId: productId, productName: productName,
        quantity: r.qty, costPrice: r.costPrice||0, sellingPrice: r.sellingPrice||0, markedOwed: markedOwed,
        paymentMethod: payMethod, txId: payHere ? batchTx : '', discount: rowDisc[i]
      };
      if(wantsCredit){
        Object.assign(sale, credit, {
          isCredit:true, amountPaid:rowPaid,
          payments: rowPaid>0 ? [{date:date, amount:rowPaid, method:payMethod, txId:sale.txId, byUid:STATE.session.userId, txClaim:claimThis}] : []
        });
      }
      soldList.push(await addSale(sale, {skipTxClaim: !claimThis}));
      if(claimThis) claimDone = true;
      if(wantsCredit) remainingPaid = round2(remainingPaid-rowPaid);
      saved++;
    }
    STATE.bulkSaleDraft = {date:todayStr(), markedOwed:false, paymentMethod:'cash', txId:'', discount:0, credit:false, customerName:'', customerPhone:'', dueDate:'', paidNow:0, claimedTx:'', rows:[{name:'',qty:1,costPrice:0,sellingPrice:0}]};
    if(STATE.autoReceipt && soldList.length){ STATE.modal = {type:'saleReceipt', data:{sales:soldList}}; STATE.quickSaleTopMode = 'single'; }
    else { STATE.quickSaleTopMode = 'single'; STATE.view = 'sales'; }
    render();
  }catch(err){
    showActionError(err);
    if(saved>0){
      /* keep only the rows that did NOT save, so pressing Save again can never double-record the others */
      d.rows = validRows.slice(saved);
      if(wantsCredit) d.paidNow = remainingPaid;
      if(claimDone && batchTx) d.claimedTx = batchTx;
      alert(saved+' of '+validRows.length+' sales were saved. The rest are still on screen — fix the problem and press Save again.');
      render();
    }
    if(submitBtn) submitBtn.disabled = false;
  }
}

async function onImportCsv(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(typeof Papa === 'undefined'){ alert('CSV import library failed to load. Check your connection and try again.'); return; }
  Papa.parse(file, {
    header:true, skipEmptyLines:true,
    complete: async function(results){
      var rows = results.data;
      var added = 0, skipped = 0;
      for(var i=0;i<rows.length;i++){
        var r = rows[i];
        var name = (r['Name']||r['name']||'').trim();
        if(!name) continue;
        var exists = STATE.data.products.some(function(p){ return p.name.toLowerCase()===name.toLowerCase(); });
        if(exists){ skipped++; continue; }
        try{
          await saveProductDoc({
            name:name,
            category:(r['Category']||r['category']||'').trim(),
            barcode:(r['Barcode']||r['barcode']||r['SKU']||r['sku']||'').trim(),
            costPrice:parseFloat(r['Cost Price']||r['costPrice']||r['Cost price']||0)||0,
            sellingPrice:parseFloat(r['Selling Price']||r['sellingPrice']||r['Selling price']||0)||0,
            openingStock:parseFloat(r['Opening Stock']||r['openingStock']||r['Opening stock']||0)||0,
            currentStock:parseFloat(r['Opening Stock']||r['openingStock']||r['Opening stock']||0)||0,
            reorderLevel:parseFloat(r['Reorder Level']||r['reorderLevel']||r['Reorder level']||0)||0,
            expiryDate:(function(v){ v=String(v||'').trim(); return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:''; })(r['Expiry']||r['expiry']||r['Expiry Date']||r['expiryDate'])
          }, null);
          added++;
        }catch(e){ /* skip row on error */ }
      }
      ev.target.value = '';
      alert(added+' product(s) imported.'+(skipped?(' '+skipped+' skipped (already exist).'):''));
    },
    error: function(){ alert('Could not read that CSV file.'); ev.target.value=''; }
  });
}

async function onGenerateInvoice(ev){
  ev.preventDefault();
  var d = STATE.invoiceDraft;
  var items = d.items.filter(function(it){ return (it.name||'').trim() && (it.qty||0)>0; }).map(function(it){
    return {name:it.name.trim(), qty:it.qty, unitPrice:it.unitPrice, lineTotal:round2(it.qty*it.unitPrice)};
  });
  if(!items.length){ alert('Add at least one item with a name and quantity.'); return; }
  var subtotal = round2(items.reduce(function(a,it){return a+it.lineTotal;},0));
  var discount = Math.min(Math.max(round2(parseFloat(d.discount)||0),0), subtotal);
  var total = round2(subtotal - discount);
  try{
    if(STATE.editingInvoiceId){
      var existing = (STATE.data.invoices||[]).find(function(x){return x.id===STATE.editingInvoiceId;}) || {};
      var updated = {
        invoiceNo: existing.invoiceNo || ('INV-'+String((STATE.data.invoices||[]).length+1).padStart(4,'0')),
        customerName: d.customerName||'', phone: d.phone||'', address: d.address||'', paymentMethod: d.paymentMethod||'cash',
        items: items, subtotal: subtotal, discount: discount, total: total,
        createdAt: existing.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      await shopRef().collection('invoices').doc(STATE.editingInvoiceId).set(updated);
      STATE.invoicePreview = Object.assign({id:STATE.editingInvoiceId}, updated);
      STATE.editingInvoiceId = null;
    } else {
      var invoiceNo = 'INV-'+String((STATE.data.invoices||[]).length+1).padStart(4,'0');
      var invoice = {
        invoiceNo: invoiceNo,
        customerName: d.customerName||'', phone: d.phone||'', address: d.address||'', paymentMethod: d.paymentMethod||'cash',
        items: items, subtotal: subtotal, discount: discount, total: total,
        createdAt: new Date().toISOString()
      };

}

async function saveBlob(blob, filename){
  try{
    var downloads = window.claude ? await window.claude.use('downloads') : null;
    if(downloads){
      await downloads.save({filename: filename, data: blob});
    } else {
      fallbackDownload(blob, filename);
    }
  }catch(err){
    if(err && err.code === 'declined'){ /* user cancelled, no-op */ }
    else { fallbackDownload(blob, filename); }
  }
}
function fallbackDownload(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function csvRow(arr){
  return arr.map(function(v){
    v = (v===undefined||v===null)?'':String(v);
    if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }).join(',');
}
async function exportCSV(){
  var lines = [];
  lines.push('SALES');
  lines.push(csvRow(['Date','Product','Quantity','Cost Price','Selling Price','Total Sales','COGS','Gross Profit','Discount','Payment Method','Transaction ID','On Credit','Customer','Amount Paid','Balance Due']));
  STATE.data.sales.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(s){
    lines.push(csvRow([s.date,s.productName,s.quantity,s.costPrice,s.sellingPrice,s.totalSales,s.cogs,s.grossProfit,s.discount||0,payLabel(s.paymentMethod),s.txId||'',saleIsCredit(s)?'Yes':'No',s.customerName||'',saleIsCredit(s)?(s.amountPaid||0):s.totalSales,saleBalanceDue(s)]));
  });
  lines.push(''); lines.push('EXPENSES');
  lines.push(csvRow(['Date','Category','Description','Amount']));
  STATE.data.expenses.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
    lines.push(csvRow([e.date,e.category,e.description,e.amount]));
  });
  lines.push(''); lines.push('STOCK PURCHASES');
  lines.push(csvRow(['Date','Product','Quantity','Unit Cost','Total Cost','Supplier']));
  STATE.data.stockPurchases.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(sp){
    lines.push(csvRow([sp.date,sp.productName,sp.quantity,sp.unitCost,sp.totalCost,sp.supplier]));
  });
  lines.push(''); lines.push('PRODUCTS');
  lines.push(csvRow(['Name','Category','Cost Price','Selling Price','Opening Stock','Current Stock','Pending (stock)','Reorder Level']));
  STATE.data.products.forEach(function(p){
    lines.push(csvRow([p.name,p.category,p.costPrice,p.sellingPrice,p.openingStock,p.currentStock,p.debt||0,p.reorderLevel]));
  });
  var csv = '\uFEFF'+lines.join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  await saveBlob(blob, 'shop-sales-record-'+todayStr()+'.csv');
}

if(FIREBASE_OK){
  auth.onAuthStateChanged(async function(user){
    unsubscribeAll();
    if(user){
      try{
        var staffInfo = await resolveStaffSession(user.uid);
        if(staffInfo.status !== 'active'){
          STATE.session = null; STATE.data = null; STATE.shopProfile = null;
          STATE.authLoading = false; STATE.authBusy = false;
          STATE.authError = 'Your account has been deactivated. Please contact the CEO/administrator.';
          auth.signOut();
          render();
          return;
        }
        STATE.session = {userId:user.uid, shopId:staffInfo.shopId, role:staffInfo.role, branchId:staffInfo.branchId||null};
        STATE.data = {products:[],sales:[],stockPurchases:[],expenses:[],invoices:[],backupSavings:[],branches:[],staff:[],dayCloses:[],cashLoans:[]};
        var profSnap = await db.collection('shops').doc(staffInfo.shopId).get();
        STATE.shopProfile = profSnap.exists ? profSnap.data() : {shopName:'',ownerName:'',email:user.email,createdAt:new Date().toISOString()};
        if(STATE.shopProfile.colorPalette && STATE.shopProfile.colorPalette !== PALETTE){ applyPalette(STATE.shopProfile.colorPalette); }
        subscribeAll(staffInfo.shopId);
        resetIdleTimers();
        initLockState();
        STATE.authLoading = false;
        STATE.authBusy = false;
        STATE.authError=''; STATE.authMsg='';
        render();
      }catch(e){
        STATE.session = null; STATE.data = null; STATE.shopProfile = null;
        STATE.authLoading = false; STATE.authBusy = false;
        STATE.authError = friendlyAuthError(e);
        render();
      }
    } else {
      STATE.session = null;
      STATE.data = null;
      STATE.shopProfile = null;
      clearTimeout(idleTimer); clearTimeout(idleWarnTimer);
      STATE.authLoading = false;
      STATE.authBusy = false;
      STATE.view = 'dashboard';
      render();
    }
  });
} else {

}
render();
