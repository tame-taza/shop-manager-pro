<style>
:root{
  --green-900:#0f1b2e;
  --green-700:#1d3a5f;
  --green-600:#2c5c8f;
  --green-100:#e9eef5;
  --green-50:#f6f8fb;
  --gold:#c9a227;
  --gold-light:#f7ecc6;
  --gold-dark:#8a6d1a;
  --paper:#ffffff;
  --ink:#182620;
  --ink-soft:#5c6d64;
  --ink-faint:#93a49b;
  --border:#dbe8e0;
  --amber:#b7791f;
  --amber-bg:#fdf3e0;
  --red:#b23b3b;
  --red-bg:#fbeaea;
  --success:#0e9c5a;
  --success-bg:#e6f7ee;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --shadow:0 1px 3px rgba(15,27,46,.08), 0 14px 32px -16px rgba(15,27,46,.28);
  --shadow-lg:0 4px 10px rgba(15,27,46,.10), 0 24px 48px -18px rgba(15,27,46,.32);
  --grad-brand:linear-gradient(135deg,var(--green-600),var(--green-900));
  --grad-gold:linear-gradient(135deg,#e6c65c,var(--gold-dark));
  --font-ui:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-am:'Noto Sans Ethiopic','Manrope',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1917; --green-50:#0d1917; --green-100:#132825; --ink:#eaf3ee; --ink-soft:#a9bcb2; --ink-faint:#71877b;
    --border:#25392f; --amber-bg:#2b2210; --red-bg:#2c1717; --success:#2fbf7a; --success-bg:#123626; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0d1917; --green-50:#0d1917; --green-100:#132825; --ink:#eaf3ee; --ink-soft:#a9bcb2; --ink-faint:#71877b;
  --border:#25392f; --amber-bg:#2b2210; --red-bg:#2c1717; --success:#2fbf7a; --success-bg:#123626; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--green-50);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
[lang-am]{font-family:var(--font-am);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:240px;flex-shrink:0;background:var(--grad-brand);color:#eafff2;
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
  box-shadow:6px 0 24px -12px rgba(0,0,0,.35);
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--grad-gold);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#3a2c05;flex-shrink:0;box-shadow:0 3px 10px rgba(0,0,0,.25);}
.brand-text{line-height:1.15;}
.brand-text b{display:block;font-size:15px;font-weight:900;}
.brand-text span{display:block;font-size:11px;color:var(--gold-light);letter-spacing:.02em;}
.nav-group{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  color:#cfe9db;text-decoration:none;font-size:13.5px;font-weight:600;cursor:pointer;border:none;background:none;text-align:left;width:100%;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
.nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-svg{width:18px;height:18px;}
.sidebar-foot{padding-top:12px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px;}
.shop-chip{font-size:12px;color:#a9d9c1;padding:0 8px 6px;line-height:1.4;}
.shop-chip b{display:block;color:#fff;font-size:13px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 22px;background:var(--paper);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:17px;margin:0;font-weight:800;}
.topbar-sub{font-size:11px;color:var(--ink-soft);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{background:var(--green-100);border:1px solid var(--border);color:var(--green-900);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.content{padding:22px;flex:1;max-width:1200px;width:100%;margin:0 auto;}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid-4{grid-template-columns:1fr 1fr;}.grid-2{grid-template-columns:1fr;}}
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow);}
.card h3{margin:0 0 4px;font-size:12px;color:var(--ink-soft);font-weight:700;}
.stat-value{font-size:22px;font-weight:900;margin:2px 0 0;}
.stat-value.sv-black{color:var(--ink);}
.stat-value.sv-green{color:var(--success);}
.stat-value.sv-red{color:var(--red);}
.stat-value.sv-blue{color:#2566a8;}
.stat-sub{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.btn{background:var(--grad-brand);color:#fff;border:none;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{filter:brightness(1.08);}
.btn-gold{background:var(--grad-gold);color:#3a2c05;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--ink);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px;}
.btn-block{width:100%;justify-content:center;}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--paper);color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-600);outline-offset:1px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--paper);}
table{border-collapse:collapse;width:100%;min-width:680px;}
th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap;}
th{background:var(--green-50);font-size:11px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
tbody tr:hover{background:var(--green-50);}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;}
.pill-green{background:var(--success-bg);color:var(--success);}
.pill-amber{background:var(--amber-bg);color:var(--amber);}
.pill-red{background:var(--red-bg);color:var(--red);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:space-between;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--green-50);}
.auth-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px 28px;width:100%;max-width:400px;box-shadow:var(--shadow);}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.auth-tabs{display:flex;background:var(--green-100);border-radius:10px;padding:3px;margin-bottom:18px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:none;background:none;color:var(--ink-soft);}
.auth-tab.active{background:var(--paper);color:var(--green-700);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.err-text{color:var(--red);font-size:12.5px;margin-top:10px;background:var(--red-bg);padding:8px 10px;border-radius:8px;}
.ok-text{color:var(--success);font-size:12.5px;margin-top:10px;background:var(--success-bg);padding:8px 10px;border-radius:8px;}
.link-btn{background:none;border:none;color:var(--green-700);font-weight:700;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;}
.lowstock-banner{display:flex;align-items:center;gap:10px;background:var(--amber-bg);color:var(--amber);border:1px solid #f0d9a8;border-radius:var(--radius-md);padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:600;}
.red-alert-banner{display:flex;align-items:flex-start;gap:10px;background:var(--red-bg);color:var(--red);border:1px solid #f5c2c2;border-radius:var(--radius-md);padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:600;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tab-btn{padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--paper);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
.tab-btn.active{background:var(--green-700);border-color:var(--green-700);color:#fff;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.list-item:last-child{border-bottom:none;}
.combo-wrap{position:relative;}
.combo-results{border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;max-height:220px;overflow-y:auto;background:var(--paper);box-shadow:var(--shadow-lg);position:relative;z-index:3;}
.combo-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);}
.combo-item:hover{background:var(--green-50);}
.combo-selected{display:flex;align-items:center;justify-content:space-between;background:var(--green-50);border:1px solid var(--gold-light);border-radius:9px;padding:9px 12px;margin-top:6px;font-size:13px;font-weight:700;}
.invoice-items{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin:10px 0;}
.invoice-item-row{display:grid;grid-template-columns:1fr 60px 90px 90px 30px;gap:6px;padding:8px 10px;align-items:center;border-bottom:1px solid var(--border);background:var(--paper);}
.remove-line{background:var(--red-bg);color:var(--red);border:none;border-radius:6px;width:26px;height:26px;cursor:pointer;font-weight:800;}
@media print{
  @page{ size: auto; margin: 8mm; }
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;left:0;top:0;width:100%;}
}
</style>

<script>
(function(){

var LANG = localStorage.getItem('ssr_lang') || 'en';
var THEME = localStorage.getItem('ssr_theme') || 'system';
function applyTheme(theme){
  THEME = theme;
  localStorage.setItem('ssr_theme', theme);
  if(theme==='system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}
applyTheme(THEME);

var T = {
  en:{
    app_name:"Taza DSR", tagline:"Shop Sales Record", dashboard:"Dashboard", quick_sale:"Quick Sale", sales:"Sales",
    invoice:"Invoice", calendar:"Calendar", products:"Products", stock_purchase:"Stock Purchases", expenses:"Expenses",
    reports:"Reports", settings:"Settings", logout:"Log Out", total_sales:"Total Sales", cogs:"COGS",

  },

    invoice:"ደረሰኝ", calendar:"የቀን መቁጠሪያ", products:"ምርቶች", stock_purchase:"የስቶክ ግዢ", expenses:"ወጪዎች",
    reports:"ሪፖርቶች", settings:"ቅንብሮች", logout:"ውጣ", total_sales:"ጠቅላላ የሽያጭ ገቢ", cogs:"የተሸጡ እቃዎች ወጪ",

    inventory_val:"የስቶክ እቃዎች ዋጋ (Asset)"
  }
};
function tr(k){ return (T[LANG] && T[LANG][k]) || T.en[k] || k; }

var firebaseConfig = {
  apiKey: "AIzaSyCYAsArtSuGpCi9aV5Q7pBiz4g7OsJawZw",
  authDomain: "daily-sales-recorder.firebaseapp.com",
  projectId: "daily-sales-recorder",
  storageBucket: "daily-sales-recorder.firebasestorage.app",
  messagingSenderId: "133367125880",
  appId: "1:133367125880:web:b4f6e39d46f8fdf66d5a8d"
};

var auth = null, db = null, FIREBASE_OK = false;
try{
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){}
  FIREBASE_OK = true;
}catch(e){
  FIREBASE_OK = false;
}

function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function pad(n){ return n<10?('0'+n):(''+n); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ var p=s.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
function fmtDateLong(s){ if(!s) return ''; var d=parseISO(s); var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+m[d.getMonth()]+' '+d.getFullYear(); }
function startOfWeek(d){ var day=d.getDay(); var diff=(day===0?-6:1-day); var r=new Date(d); r.setDate(d.getDate()+diff); r.setHours(0,0,0,0); return r; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfYear(d){ return new Date(d.getFullYear(),0,1); }
function fmtETB(n){ n = n||0; var neg = n<0; n = Math.abs(n); var s = n.toLocaleString('en-US',{maximumFractionDigits:2, minimumFractionDigits: (n%1!==0)?2:0}); return (neg?'-':'')+s+' ETB'; }

var STATE = {
  view:'dashboard',
  authLoading:true,
  user:null,
  profile:null,
  authTab:'login',
  authError:'',
  authMsg:'',
  forgotMode:false,
  dashboardPeriod:'today',
  quickSaleMode:'existing',
  quickSaleQuery:'',
  quickSaleSelectedId:'',
  calSelectedDate:todayStr(),
  invoiceDraft:{customerName:'',phone:'',address:'',items:[{name:'',qty:1,unitPrice:0}]},
  invoicePreview:null,
  data:{products:[],sales:[],stockPurchases:[],expenses:[],invoices:[]}
};

function shopRef(){ return db.collection('shops').doc(STATE.user.uid); }

function subscribeAll(uid){
  var base = db.collection('shops').doc(uid);
  base.onSnapshot(function(d){ if(d.exists) STATE.profile = d.data(); render(); });
  base.collection('products').onSnapshot(function(s){ STATE.data.products = s.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); render(); });
  base.collection('sales').onSnapshot(function(s){ STATE.data.sales = s.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); render(); });
  base.collection('stockPurchases').onSnapshot(function(s){ STATE.data.stockPurchases = s.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); render(); });
  base.collection('expenses').onSnapshot(function(s){ STATE.data.expenses = s.docs.map(function(d){return Object.assign({id:d.id}, d.data());}); render(); });
  base.collection('invoices').onSnapshot(function(s){ STATE.data.invoices = s.docs.map(function(d){return Object.assign({id:d.id}, d.data());}).sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');}); render(); });
}

function periodRangeFor(period){
  var t = new Date();
  if(period==='week') return {from:todayStr().slice(0,8)+pad(startOfWeek(t).getDate()), to:todayStr(), label:'This Week'};
  if(period==='month') return {from:todayStr().slice(0,8)+'01', to:todayStr(), label:'This Month'};
  if(period==='year') return {from:todayStr().slice(0,5)+'01-01', to:todayStr(), label:'This Year'};
  return {from:todayStr(), to:todayStr(), label:'Today'};
}

function periodStats(fromStr,toStr){
  var s = STATE.data.sales.filter(function(x){ return x.date>=fromStr && x.date<=toStr; });
  var ex = STATE.data.expenses.filter(function(x){ return x.date>=fromStr && x.date<=toStr; });
  var sp = STATE.data.stockPurchases.filter(function(x){ return x.date>=fromStr && x.date<=toStr; });
  var totalSales = round2(s.reduce(function(a,x){return a+(x.totalSales||0);},0));
  var cogs = round2(s.reduce(function(a,x){return a+(x.cogs||0);},0));
  var gross = round2(totalSales - cogs);
  var expTotal = round2(ex.reduce(function(a,x){return a+(x.amount||0);},0));
  var stockTotal = round2(sp.reduce(function(a,x){return a+(x.totalCost||0);},0));
  return { totalSales:totalSales, cogs:cogs, gross:gross, expenses:expTotal, net:round2(gross-expTotal), stockPurchases:stockTotal, count:s.length };
}

    chart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',

  };

function render(){
  var app = document.getElementById('app');
  if(!FIREBASE_OK){
    app.innerHTML = '<div class="auth-wrap"><div class="auth-card"><h3>Connection Error</h3><p>Could not initialize Firebase.</p></div></div>';
    return;
  }
  if(STATE.authLoading){
    app.innerHTML = '<div class="auth-wrap"><div style="font-weight:700;">Loading Taza DSR...</div></div>';
    return;
  }
  if(!STATE.user){

  } else {
    renderMain(app);
  }
}

function renderAuth(app){
  if(STATE.forgotMode){
    app.innerHTML = '<div class="auth-wrap"><div class="auth-card">'+
      '<div class="auth-brand"><div class="brand-mark">TT</div><div><b>Taza DSR</b><span class="muted">Shop Sales Record</span></div></div>'+
      '<h3>Reset Password</h3>'+
      '<form id="forgotForm"><label>Email</label><input type="email" name="email" required placeholder="you@example.com">'+
      (STATE.authError?'<div class="err-text">'+STATE.authError+'</div>':'')+
      (STATE.authMsg?'<div class="ok-text">'+STATE.authMsg+'</div>':'')+
      '<button type="submit" class="btn btn-block" style="margin-top:14px;">Send Reset Link</button>'+
      '</form><div style="text-align:center;margin-top:14px;"><button class="link-btn" id="backLoginBtn">← Back to Login</button></div></div></div>';
    document.getElementById('forgotForm').onsubmit = async function(e){
      e.preventDefault();
      var em = new FormData(e.target).get('email');
      try{ await auth.sendPasswordResetEmail(em); STATE.authMsg='Reset email sent. Please check your inbox.'; STATE.authError=''; render(); }
      catch(err){ STATE.authError=err.message; render(); }
    };
    document.getElementById('backLoginBtn').onclick = function(){ STATE.forgotMode=false; render(); };
    return;
  }

  app.innerHTML = '<div class="auth-wrap"><div class="auth-card">'+
    '<div class="auth-brand"><div class="brand-mark">TT</div><div><b>Taza DSR</b><span class="muted">Shop Sales Record</span></div></div>'+
    '<div class="auth-tabs">'+
      '<button class="auth-tab'+(STATE.authTab==='login'?' active':'')+'" id="tabLoginBtn">Log in</button>'+
      '<button class="auth-tab'+(STATE.authTab==='signup'?' active':'')+'" id="tabSignupBtn">Sign up</button>'+
    '</div>'+
    (STATE.authTab==='login' ? (
      '<form id="loginForm"><label>Email</label><input type="email" name="email" required placeholder="you@example.com">'+
      '<label>Password</label><input type="password" name="password" required placeholder="••••••••">'+
      (STATE.authError?'<div class="err-text">'+STATE.authError+'</div>':'')+
      '<button type="submit" class="btn btn-block" style="margin-top:16px;">Log in</button>'+
      '</form><div style="text-align:center;margin-top:14px;"><button class="link-btn" id="forgotBtn">Forgot password?</button></div>'
    ) : (
      '<form id="signupForm"><label>Shop Name</label><input name="shopName" required placeholder="e.g. Selam General Store">'+
      '<label>Owner Name</label><input name="ownerName" required placeholder="Full Name">'+
      '<label>Email</label><input type="email" name="email" required placeholder="you@example.com">'+
      '<label>Password (min 8 chars)</label><input type="password" name="password" minlength="8" required placeholder="••••••••">'+
      (STATE.authError?'<div class="err-text">'+STATE.authError+'</div>':'')+
      '<button type="submit" class="btn btn-block" style="margin-top:16px;">Create Account</button></form>'
    ))+
    '</div></div>';

  if(document.getElementById('tabLoginBtn')) document.getElementById('tabLoginBtn').onclick = function(){ STATE.authTab='login'; STATE.authError=''; render(); };
  if(document.getElementById('tabSignupBtn')) document.getElementById('tabSignupBtn').onclick = function(){ STATE.authTab='signup'; STATE.authError=''; render(); };
  if(document.getElementById('forgotBtn')) document.getElementById('forgotBtn').onclick = function(){ STATE.forgotMode=true; STATE.authError=''; STATE.authMsg=''; render(); };

  var lf = document.getElementById('loginForm');
  if(lf) lf.onsubmit = async function(e){
    e.preventDefault();
    var fd = new FormData(e.target);
    try{ await auth.signInWithEmailAndPassword(fd.get('email'), fd.get('password')); }
    catch(err){ STATE.authError = err.message; render(); }
  };
  var sf = document.getElementById('signupForm');
  if(sf) sf.onsubmit = async function(e){
    e.preventDefault();
    var fd = new FormData(e.target);
    try{
      var cred = await auth.createUserWithEmailAndPassword(fd.get('email'), fd.get('password'));
      await db.collection('shops').doc(cred.user.uid).set({
        shopName: fd.get('shopName'), ownerName: fd.get('ownerName'), email: fd.get('email'), createdAt: new Date().toISOString()
      });
    }catch(err){ STATE.authError = err.message; render(); }
  };
}

function renderViewContent(){
  switch(STATE.view){
    case 'dashboard': return renderDashboard();
    case 'quickSale': return renderQuickSale();
    case 'sales': return renderSales();
    case 'products': return renderProducts();
    case 'stockPurchase': return renderStockPurchase();
    case 'expenses': return renderExpenses();
    case 'invoice': return renderInvoice();
    case 'calendar': return renderCalendar();
    case 'reports': return renderReports();
    case 'settings': return renderSettings();
    default: return renderDashboard();
  }
}

function renderDashboard(){
  var range = periodRangeFor(STATE.dashboardPeriod);
  var stats = periodStats(range.from, range.to);

  var allSalesPaid = STATE.data.sales.filter(function(s){return s.paymentStatus!=='OWED';}).reduce(function(a,x){return a+(x.totalSales||0);},0);
  var allStockCost = STATE.data.stockPurchases.reduce(function(a,x){return a+(x.totalCost||0);},0);
  var allExpenses = STATE.data.expenses.reduce(function(a,x){return a+(x.amount||0);},0);
  var currentStoreCash = round2(allSalesPaid - allStockCost - allExpenses);
  var inventoryValue = round2(STATE.data.products.reduce(function(a,p){ return a+((p.currentStock||0)*(p.costPrice||0)); },0));
  var lowStock = STATE.data.products.filter(function(p){ return (p.currentStock||0) <= (p.reorderLevel||0); });

  var tabs = ['today','week','month','year'].map(function(p){
    var labels = {today:'Today',week:'Weekly',month:'Monthly',year:'Yearly'};
    return '<button class="tab-btn'+(STATE.dashboardPeriod===p?' active':'')+'" data-dash-period="'+p+'">'+labels[p]+'</button>';
  }).join('');

  var html = '';
  if(lowStock.length){
    html += '<div class="lowstock-banner">⚠️ <span>'+lowStock.length+' product(s) at or below reorder level.</span> <button class="link-btn" data-nav="products" style="margin-left:auto;">View Products</button></div>';
  }
  if(currentStoreCash < 0){
    html += '<div class="red-alert-banner">🚨 <div><b>Cash Deficit Alert:</b> Stock purchases exceeded available store cash by '+fmtETB(Math.abs(currentStoreCash))+'. The excess amount was funded from store profit reserves.</div></div>';
  }

  html += '<div class="tabs">'+tabs+'</div>'+
    '<div class="grid grid-4">'+
      '<div class="card"><h3>'+tr('total_sales')+'</h3><div class="stat-value sv-black">'+fmtETB(stats.totalSales)+'</div><div class="stat-sub">'+stats.count+' sales in period</div></div>'+
      '<div class="card"><h3>'+tr('gross_profit')+'</h3><div class="stat-value sv-green">'+fmtETB(stats.gross)+'</div></div>'+
      '<div class="card"><h3>'+tr('expenses_lbl')+'</h3><div class="stat-value sv-red">'+fmtETB(stats.expenses)+'</div></div>'+
      '<div class="card"><h3>'+tr('net_profit')+'</h3><div class="stat-value sv-blue">'+fmtETB(stats.net)+'</div></div>'+
    '</div>'+
    '<div class="grid grid-4" style="margin-top:14px;">'+
      '<div class="card"><h3>'+tr('store_balance')+'</h3><div class="stat-value '+(currentStoreCash<0?'sv-red':'')+'">'+fmtETB(currentStoreCash)+'</div><div class="stat-sub">Available Store Cash</div></div>'+
      '<div class="card"><h3>'+tr('inventory_val')+'</h3><div class="stat-value">'+fmtETB(inventoryValue)+'</div><div class="stat-sub">'+STATE.data.products.length+' registered products</div></div>'+
      '<div class="card"><h3>Stock Purchases</h3><div class="stat-value">'+fmtETB(stats.stockPurchases)+'</div><div class="stat-sub">Inventory Cash Outflow</div></div>'+
      '<div class="card"><h3>Cost of Goods Sold (COGS)</h3><div class="stat-value">'+fmtETB(stats.cogs)+'</div></div>'+
    '</div>';

  return html;
}

  var stats = periodStats(range.from, range.to);
  return '<div class="card"><h3>Monthly Financial Report</h3>'+
    '<div class="grid grid-4" style="margin-top:10px;">'+
      '<div class="card"><h3>Sales</h3><div class="stat-value">'+fmtETB(stats.totalSales)+'</div></div>'+
      '<div class="card"><h3>COGS</h3><div class="stat-value">'+fmtETB(stats.cogs)+'</div></div>'+
      '<div class="card"><h3>Gross Profit</h3><div class="stat-value sv-green">'+fmtETB(stats.gross)+'</div></div>'+
      '<div class="card"><h3>Net Profit</h3><div class="stat-value sv-blue">'+fmtETB(stats.net)+'</div></div>'+
    '</div><button class="btn btn-sm btn-gold" id="repExcelBtn" style="margin-top:16px;">Download Complete Excel Report</button></div>';
}

function renderSettings(){
  var u = STATE.profile || {};
  return '<div class="two-col"><div class="card"><h3>Shop Profile</h3>'+
    '<form id="profileForm"><label>Shop Name</label><input name="shopName" value="'+(u.shopName||'')+'">'+
    '<label>Owner Name</label><input name="ownerName" value="'+(u.ownerName||'')+'">'+
    '<label>Address</label><input name="shopAddress" value="'+(u.shopAddress||'')+'">'+
    '<label>Phone</label><input name="shopPhone" value="'+(u.shopPhone||'')+'">'+
    '<button type="submit" class="btn btn-block" style="margin-top:14px;">Save Profile</button></form></div>'+
    '<div class="card"><h3>About Application</h3><p style="color:var(--ink-soft);line-height:1.6;"><b>Taza DSR — Shop Sales Record</b><br>Developer: Tamrat Zemecha<br>Company: Taza Technology™<br>Country: Ethiopia<br>Email: Tamratzemechatilahun@gmail.com</p></div></div>';
}

function bindViewEvents(){
  var qsForm = document.getElementById('quickSaleForm');
  if(qsForm){
    document.querySelectorAll('[data-qs-mode]').forEach(function(b){
      b.onclick = function(){ STATE.quickSaleMode = b.getAttribute('data-qs-mode'); render(); };
    });
    document.querySelectorAll('[data-pick-prod]').forEach(function(el){
      el.onclick = function(){ STATE.quickSaleSelectedId = el.getAttribute('data-pick-prod'); render(); };
    });
    var clr = document.getElementById('qsClearProd');
    if(clr) clr.onclick = function(){ STATE.quickSaleSelectedId = ''; render(); };
    var st = document.getElementById('qsStatus');
    if(st) st.onchange = function(){
      var ob = document.getElementById('qsOwedBox');
      if(ob) ob.style.display = st.value==='OWED' ? 'block' : 'none';
    };

    qsForm.onsubmit = async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var qty = parseFloat(fd.get('quantity'))||1;
      var cost = parseFloat(fd.get('costPrice'))||0;
      var sell = parseFloat(fd.get('sellingPrice'))||0;
      var total = round2(qty*sell);
      var cogs = round2(qty*cost);

      var pName = fd.get('productName');
      var pId = fd.get('productId');
      if(!pName && pId){
        var pr = STATE.data.products.find(function(x){return x.id===pId;});
        if(pr) pName = pr.name;
      }

      await shopRef().collection('sales').add({
        date: fd.get('date'),
        productId: pId||null,
        productName: pName||'Item',
        quantity: qty, costPrice: cost, sellingPrice: sell, totalSales: total, cogs: cogs, grossProfit: round2(total-cogs),
        paymentMethod: fd.get('paymentMethod'), paymentStatus: fd.get('paymentStatus')||'PAID',
        customerName: fd.get('customerName')||'', customerPhone: fd.get('customerPhone')||'',
        createdAt: new Date().toISOString()
      });

      if(pId){
        var prodRef = shopRef().collection('products').doc(pId);
        var doc = await prodRef.get();
        if(doc.exists){
          var cur = doc.data().currentStock||0;
          await prodRef.update({currentStock: Math.max(0, cur-qty)});
        }
      }

      STATE.view = 'sales';
      render();
    };
  }

  var expF = document.getElementById('expForm');
  if(expF){
    expF.onsubmit = async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      await shopRef().collection('expenses').add({
        date: fd.get('date'), category: fd.get('category'), amount: parseFloat(fd.get('amount'))||0, description: fd.get('description')||'', createdAt: new Date().toISOString()
      });
      STATE.view = 'dashboard';
      render();
    };
  }

  var stF = document.getElementById('stockForm');
  if(stF){
    stF.onsubmit = async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var pId = fd.get('productId');
      var qty = parseFloat(fd.get('quantity'))||1;
      var cost = parseFloat(fd.get('unitCost'))||0;
      var pr = STATE.data.products.find(function(x){return x.id===pId;});
      await shopRef().collection('stockPurchases').add({
        date: fd.get('date'), productId: pId, productName: pr?pr.name:'Item', quantity: qty, unitCost: cost, totalCost: round2(qty*cost), supplier: fd.get('supplier')||'', createdAt: new Date().toISOString()
      });
      if(pId){
        var docRef = shopRef().collection('products').doc(pId);
        var snap = await docRef.get();
        if(snap.exists) await docRef.update({currentStock: (snap.data().currentStock||0)+qty});
      }
      STATE.view = 'dashboard';
      render();
    };
  }

  var prF = document.getElementById('profileForm');
  if(prF){
    prF.onsubmit = async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      await shopRef().update({
        shopName: fd.get('shopName'), ownerName: fd.get('ownerName'), shopAddress: fd.get('shopAddress'), shopPhone: fd.get('shopPhone')
      });
      alert('Profile saved.');
    };
  }

  document.querySelectorAll('[data-del-sale]').forEach(function(b){
    b.onclick = async function(){
      if(confirm('Delete this sale? Stock will be restored.')){
        await shopRef().collection('sales').doc(b.getAttribute('data-del-sale')).delete();
      }
    };
  });
  document.querySelectorAll('[data-del-prod]').forEach(function(b){
    b.onclick = async function(){
      if(confirm('Delete this product?')){
        await shopRef().collection('products').doc(b.getAttribute('data-del-prod')).delete();
      }
    };
  });

  var calPicker = document.getElementById('calDatePick');
  if(calPicker) calPicker.onchange = function(){ STATE.calSelectedDate = calPicker.value; render(); };

  var expExcel = document.getElementById('exportSalesXlsx');
  if(expExcel) expExcel.onclick = function(){
    if(typeof XLSX==='undefined'){ alert('XLSX library loading...'); return; }
    var wb = XLSX.utils.book_new();
    var rows = STATE.data.sales.map(function(s){ return {Date:s.date, Product:s.productName, Qty:s.quantity, Total:s.totalSales, Profit:s.grossProfit, Status:s.paymentStatus}; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Sales');
    XLSX.writeFile(wb, 'Taza-DSR-Sales-'+todayStr()+'.xlsx');
  };
}

if(FIREBASE_OK){
  auth.onAuthStateChanged(function(user){
    STATE.user = user;
    STATE.authLoading = false;
    if(user){
      subscribeAll(user.uid);
    } else {
      render();
    }
  });
} else {
  STATE.authLoading = false;
  render();
}

})();
</script>
</body>
</html>
