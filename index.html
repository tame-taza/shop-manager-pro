<head>

<style>
:root{
  --green-900:#0d4f31;
  --green-700:#146c43;
  --green-600:#1a8a58;
  --green-100:#e8f5ee;
  --green-50:#f4faf6;
  --paper:#ffffff;
  --ink:#182620;
  --ink-soft:#5c6d64;
  --ink-faint:#93a49b;
  --border:#dbe8e0;
  --amber:#b7791f;
  --amber-bg:#fdf3e0;
  --red:#b23b3b;
  --red-bg:#fbeaea;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --shadow:0 1px 2px rgba(13,79,49,.06), 0 8px 24px -12px rgba(13,79,49,.18);
  --font-ui:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-am:'Noto Sans Ethiopic','Manrope',sans-serif;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1a14; --green-50:#0f1a14; --green-100:#152a20; --ink:#eaf3ee; --ink-soft:#a9bcb2; --ink-faint:#71877b;
    --border:#25392f; --amber-bg:#2b2210; --red-bg:#2c1717; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0f1a14; --green-50:#0f1a14; --green-100:#152a20; --ink:#eaf3ee; --ink-soft:#a9bcb2; --ink-faint:#71877b;
  --border:#25392f; --amber-bg:#2b2210; --red-bg:#2c1717; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--green-50);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
[lang-am]{font-family:var(--font-am);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--green-900);color:#eafff2;
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(155deg,var(--green-600),#0a3a24);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-text b{display:block;font-size:14.5px;font-weight:800;}
.brand-text span{display:block;font-size:10.5px;color:#9fd8bb;letter-spacing:.02em;}
.nav-group{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  color:#cfe9db;text-decoration:none;font-size:14px;font-weight:600;cursor:pointer;border:none;background:none;text-align:left;width:100%;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--green-600);color:#fff;}
.nav-icon{font-size:16px;width:20px;text-align:center;}
.sidebar-foot{padding-top:12px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px;}
.shop-chip{font-size:12px;color:#a9d9c1;padding:0 8px 6px;line-height:1.4;}
.shop-chip b{display:block;color:#fff;font-size:13px;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 22px;background:var(--paper);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:18px;margin:0;font-weight:800;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{background:var(--green-100);border:1px solid var(--border);color:var(--green-900);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.icon-btn:hover{background:var(--green-100);filter:brightness(.97);}
.menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:17px;}
.content{padding:22px;flex:1;max-width:1180px;width:100%;margin:0 auto;}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid-4{grid-template-columns:1fr 1fr;}.grid-2{grid-template-columns:1fr;}}
.card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;box-shadow:var(--shadow);}
.card h3{margin:0 0 4px;font-size:12.5px;color:var(--ink-soft);font-weight:700;text-transform:none;}
.stat-value{font-size:22px;font-weight:800;margin:2px 0 0;}
.stat-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.section-title{font-size:15px;font-weight:800;margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
.trophy-card{display:flex;align-items:center;gap:14px;padding:16px 18px;}
.trophy-emoji{font-size:26px;}
.trophy-date{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.trophy-amt{font-size:19px;font-weight:800;color:var(--green-700);}
.btn{background:var(--green-700);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--green-600);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--ink);}
.btn-outline:hover{background:var(--green-100);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-danger:hover{filter:brightness(.96);}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn-block{width:100%;justify-content:center;}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px;}
label:first-child{margin-top:0;}
input,select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--paper);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green-600);outline-offset:1px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.form-row{grid-template-columns:1fr;}}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--paper);}
table{border-collapse:collapse;width:100%;min-width:680px;}
th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap;}
th{background:var(--green-50);font-size:11.5px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.03em;}
tbody tr:hover{background:var(--green-50);}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.pill-green{background:var(--green-100);color:var(--green-700);}
.pill-amber{background:var(--amber-bg);color:var(--amber);}
.pill-red{background:var(--red-bg);color:var(--red);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:space-between;}
.toolbar-filters{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
.toolbar-filters input,.toolbar-filters select{width:auto;min-width:140px;}
.row-actions{display:flex;gap:6px;}
.empty{padding:40px 18px;text-align:center;color:var(--ink-faint);}
.empty-emoji{font-size:30px;margin-bottom:8px;}
.modal-back{position:fixed;inset:0;background:rgba(13,30,20,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--paper);border-radius:var(--radius-lg);padding:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);}
.modal h2{margin:0 0 4px;font-size:17px;}
.modal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
.modal-close{position:absolute;}
.modal-foot{display:flex;gap:10px;margin-top:18px;}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 20% 0%,var(--green-100),var(--green-50) 55%);}
.auth-card{background:var(--paper);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px 28px;width:100%;max-width:400px;box-shadow:var(--shadow);}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.auth-tabs{display:flex;background:var(--green-100);border-radius:10px;padding:3px;margin-bottom:18px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;border:none;background:none;color:var(--ink-soft);}
.auth-tab.active{background:var(--paper);color:var(--green-700);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.err-text{color:var(--red);font-size:12.5px;margin-top:10px;background:var(--red-bg);padding:8px 10px;border-radius:8px;}
.ok-text{color:var(--green-700);font-size:12.5px;margin-top:10px;background:var(--green-100);padding:8px 10px;border-radius:8px;}
.link-btn{background:none;border:none;color:var(--green-700);font-weight:700;font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;}
.lowstock-banner{display:flex;align-items:center;gap:10px;background:var(--amber-bg);color:var(--amber);border:1px solid #f0d9a8;border-radius:var(--radius-md);padding:12px 16px;margin-bottom:16px;font-size:13px;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:10.5px;font-weight:800;color:var(--ink-faint);text-align:center;padding-bottom:4px;}
.cal-cell{border:1px solid var(--border);border-radius:9px;min-height:64px;padding:6px;font-size:11px;cursor:pointer;background:var(--paper);}
.cal-cell:hover{border-color:var(--green-600);}
.cal-cell.empty-cell{background:transparent;border:none;cursor:default;}
.cal-cell.today{border-color:var(--green-700);border-width:2px;}
.cal-cell .d{font-weight:800;font-size:12px;}
.cal-cell .amt{color:var(--green-700);font-weight:700;margin-top:3px;font-size:10.5px;}
.cal-cell.selected{background:var(--green-100);border-color:var(--green-700);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-nav b{font-size:15px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tab-btn{padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--paper);font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
.tab-btn.active{background:var(--green-700);border-color:var(--green-700);color:#fff;}
.muted{color:var(--ink-soft);font-size:12.5px;}
.bottom-nav{display:none;}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .menu-btn{display:block;}
  .content{padding:16px;}
}
.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
.sidebar-scrim.show{display:block;}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.list-item:last-child{border-bottom:none;}
.field-note{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.badge-dot{width:7px;height:7px;border-radius:99px;background:var(--red);display:inline-block;margin-right:5px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ---------------- i18n ---------------- */
var LANG = localStorage.getItem('ssr_lang') || 'en';
var T = {
  en:{app_name:"Shop Sales Record", tagline:"Taza Technology", dashboard:"Dashboard", quick_sale:"Quick Sale", sales:"Sales", calendar:"Calendar", products:"Products", stock_purchase:"Stock Purchase", expenses:"Expenses", reports:"Reports", settings:"Settings", logout:"Log out"},
  am:{app_name:"የሽያጭ መዝገብ", tagline:"ታዛ ቴክኖሎጂ", dashboard:"ዳሽቦርድ", quick_sale:"ፈጣን ሽያጭ", sales:"ሽያጮች", calendar:"የቀን መቁጠሪያ", products:"ምርቶች", stock_purchase:"የስቶክ ግዢ", expenses:"ወጪዎች", reports:"ሪፖርቶች", settings:"ቅንብሮች", logout:"ውጣ"}
};
function tr(k){ return (T[LANG]&&T[LANG][k]) || T.en[k] || k; }

/* ---------------- Firebase setup ---------------- */
var firebaseConfig = {
  apiKey: "AIzaSyCYAsArtSuGpCi9aV5Q7pBiz4g7OsJawZw",
  authDomain: "daily-sales-recorder.firebaseapp.com",
  projectId: "daily-sales-recorder",
  storageBucket: "daily-sales-recorder.firebasestorage.app",
  messagingSenderId: "133367125880",
  appId: "1:133367125880:web:b4f6e39d46f8fdf66d5a8d"
};
var auth = null, db = null, FIREBASE_OK = false;
try{
  if(typeof firebase === 'undefined') throw new Error('firebase-not-loaded');
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){}
  FIREBASE_OK = true;
}catch(e){
  FIREBASE_OK = false;
}

function friendlyAuthError(err){
  var code = err && err.code;
  var map = {
    'auth/email-already-in-use':'An account with this email already exists.',
    'auth/invalid-email':'That email address looks invalid.',
    'auth/weak-password':'Password should be at least 6 characters.',
    'auth/user-not-found':'No account found with that email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/missing-password':'Please enter a password.',
    'auth/too-many-requests':'Too many attempts. Please wait a moment and try again.',
    'auth/network-request-failed':'Network error — check your internet connection.'
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

/* live Firestore listeners for the logged-in shop */
var UNSUB = {products:null, sales:null, stockPurchases:null, expenses:null};
function shopRef(){ return db.collection('shops').doc(STATE.session.userId); }
function subscribeAll(uidStr){
  var base = db.collection('shops').doc(uidStr);
  UNSUB.products = base.collection('products').onSnapshot(function(snap){
    STATE.data.products = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){});
  UNSUB.sales = base.collection('sales').onSnapshot(function(snap){
    STATE.data.sales = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){});
  UNSUB.stockPurchases = base.collection('stockPurchases').onSnapshot(function(snap){
    STATE.data.stockPurchases = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){});
  UNSUB.expenses = base.collection('expenses').onSnapshot(function(snap){
    STATE.data.expenses = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){});
}
function unsubscribeAll(){
  Object.keys(UNSUB).forEach(function(k){ if(UNSUB[k]) UNSUB[k](); UNSUB[k]=null; });
}

/* ---------------- date helpers ---------------- */
function pad(n){ return n<10?('0'+n):(''+n); }
function isoDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return isoDate(new Date()); }
function parseISO(s){ var p=s.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
function fmtDateLong(s){ if(!s) return ''; var d=parseISO(s); var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear(); }
function startOfWeek(d){ var day=d.getDay(); var diff=(day===0?-6:1-day); var r=new Date(d); r.setDate(d.getDate()+diff); r.setHours(0,0,0,0); return r; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfYear(d){ return new Date(d.getFullYear(),0,1); }
function addDays(d,n){ var r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtETB(n){ n = n||0; var neg = n<0; n = Math.abs(n); var s = n.toLocaleString('en-US',{maximumFractionDigits:2, minimumFractionDigits: (n%1!==0)?2:0}); return (neg?'-':'')+s+' ETB'; }

/* ---------------- app state ---------------- */
var STATE = {
  view:'dashboard',
  authLoading:true,
  session:null,
  shopProfile:null,
  data:null,
  authTab:'login',
  authError:'',
  authMsg:'',
  authBusy:false,
  forgotMode:false,
  editingSale:null,
  editingProduct:null,
  editingExpense:null,
  editingStock:null,
  salesFilter:{search:'',date:'',product:''},
  quickSaleMode:'existing',
  calSelectedDate:todayStr(),
  calMonthCursor:new Date(new Date().getFullYear(), new Date().getMonth(),1),
  reportRange:'today',
  reportCustomFrom:todayStr(),
  reportCustomTo:todayStr(),
  sidebarOpen:false,
  modal:null /* {type,...} */
};

function currentUser(){ return STATE.shopProfile; }

/* ---------------- business logic (Firestore-backed) ---------------- */
function findProduct(id){ return STATE.data.products.find(function(p){return p.id===id;}); }
function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function recomputeSale(s){
  var totalSales = round2(s.quantity * s.sellingPrice);
  var cogs = round2(s.quantity * s.costPrice);
  return Object.assign({}, s, {totalSales:totalSales, cogs:cogs, grossProfit:round2(totalSales-cogs)});
}

async function addSale(saleInput){
  var base = shopRef();
  var saleRef = base.collection('sales').doc();
  var productRef = base.collection('products').doc(saleInput.productId);
  var sale = recomputeSale(Object.assign({createdAt:new Date().toISOString()}, saleInput));
  await db.runTransaction(async function(tx){
    var prodSnap = await tx.get(productRef);
    var stock = prodSnap.exists ? (prodSnap.data().currentStock||0) : 0;
    tx.set(saleRef, sale);
    tx.update(productRef, {currentStock: stock - saleInput.quantity});
  });
}

async function updateSale(saleId, patch){
  var base = shopRef();
  var saleRef = base.collection('sales').doc(saleId);
  await db.runTransaction(async function(tx){
    var saleSnap = await tx.get(saleRef);
    if(!saleSnap.exists) return;
    var oldSale = saleSnap.data();
    var recomputed = recomputeSale(Object.assign({}, oldSale, patch));
    var oldProductId = oldSale.productId, newProductId = recomputed.productId;
    if(oldProductId === newProductId){
      var ref = base.collection('products').doc(oldProductId);
      var snap = await tx.get(ref);
      if(snap.exists){
        var stock = snap.data().currentStock||0;
        var netDelta = oldSale.quantity - recomputed.quantity;
        tx.update(ref, {currentStock: stock + netDelta});
      }
    } else {
      var oldRef = base.collection('products').doc(oldProductId);
      var newRef = base.collection('products').doc(newProductId);
      var oldSnap = await tx.get(oldRef);
      var newSnap = await tx.get(newRef);
      if(oldSnap.exists) tx.update(oldRef, {currentStock: (oldSnap.data().currentStock||0) + oldSale.quantity});
      if(newSnap.exists) tx.update(newRef, {currentStock: (newSnap.data().currentStock||0) - recomputed.quantity});
    }
    tx.set(saleRef, recomputed);
  });
}

async function deleteSale(saleId){
  var base = shopRef();
  var saleRef = base.collection('sales').doc(saleId);
  await db.runTransaction(async function(tx){
    var saleSnap = await tx.get(saleRef);
    if(!saleSnap.exists) return;
    var sale = saleSnap.data();
    var prodRef = base.collection('products').doc(sale.productId);
    var prodSnap = await tx.get(prodRef);
    if(prodSnap.exists) tx.update(prodRef, {currentStock: (prodSnap.data().currentStock||0) + sale.quantity});
    tx.delete(saleRef);
  });
}

async function addStockPurchase(spInput){
  var base = shopRef();
  var spRef = base.collection('stockPurchases').doc();
  var prodRef = base.collection('products').doc(spInput.productId);
  var sp = Object.assign({}, spInput, {totalCost: round2(spInput.quantity*spInput.unitCost)});
  await db.runTransaction(async function(tx){
    var prodSnap = await tx.get(prodRef);
    var stock = prodSnap.exists ? (prodSnap.data().currentStock||0) : 0;
    tx.set(spRef, sp);
    tx.update(prodRef, {currentStock: stock + spInput.quantity});
  });
}

async function deleteStockPurchase(spId){
  var base = shopRef();
  var spRef = base.collection('stockPurchases').doc(spId);
  await db.runTransaction(async function(tx){
    var spSnap = await tx.get(spRef);
    if(!spSnap.exists) return;
    var sp = spSnap.data();
    var prodRef = base.collection('products').doc(sp.productId);
    var prodSnap = await tx.get(prodRef);
    if(prodSnap.exists) tx.update(prodRef, {currentStock: (prodSnap.data().currentStock||0) - sp.quantity});
    tx.delete(spRef);
  });
}

async function saveProductDoc(fields, existingId){
  var base = shopRef();
  if(existingId) await base.collection('products').doc(existingId).update(fields);
  else await base.collection('products').add(fields);
}
async function deleteProductDoc(id){ await shopRef().collection('products').doc(id).delete(); }
async function addExpenseDoc(fields){ await shopRef().collection('expenses').add(fields); }
async function updateExpenseDoc(id, fields){ await shopRef().collection('expenses').doc(id).update(fields); }
async function deleteExpenseDoc(id){ await shopRef().collection('expenses').doc(id).delete(); }

function salesInRange(fromStr,toStr){
  return STATE.data.sales.filter(function(s){ return s.date>=fromStr && s.date<=toStr; });
}
function expensesInRange(fromStr,toStr){
  return STATE.data.expenses.filter(function(e){ return e.date>=fromStr && e.date<=toStr; });
}
function stockPurchasesInRange(fromStr,toStr){
  return STATE.data.stockPurchases.filter(function(e){ return e.date>=fromStr && e.date<=toStr; });
}
function sumBy(arr,key){ return round2(arr.reduce(function(a,x){return a+(x[key]||0);},0)); }

function periodStats(fromStr,toStr){
  var s = salesInRange(fromStr,toStr);
  var ex = expensesInRange(fromStr,toStr);
  var totalSales = sumBy(s,'totalSales');
  var cogs = sumBy(s,'cogs');
  var gross = sumBy(s,'grossProfit');
  var expTotal = sumBy(ex,'amount');
  return { totalSales:totalSales, cogs:cogs, gross:gross, expenses:expTotal, net:round2(gross-expTotal), count:s.length };
}

function topDay(metric){
  var map = {};
  STATE.data.sales.forEach(function(s){
    map[s.date] = (map[s.date]||0) + (metric==='sales'? s.totalSales : s.grossProfit);
  });
  var best=null, bestAmt=-Infinity;
  Object.keys(map).forEach(function(d){ if(map[d]>bestAmt){ bestAmt=map[d]; best=d; } });
  return best? {date:best, amount:round2(bestAmt)} : null;
}

/* ---------------- CALENDAR ---------------- */
function renderCalendar(){
  var cursor = STATE.calMonthCursor;
  var monthStart = startOfMonth(cursor);
  var monthLabel = monthStart.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  var firstDow = monthStart.getDay(); // 0 Sun
  var leadBlank = (firstDow===0?6:firstDow-1); // make Monday first
  var daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();

  var byDate = {};
  STATE.data.sales.forEach(function(s){
    if(!byDate[s.date]) byDate[s.date] = {sales:0,profit:0};
    byDate[s.date].sales += s.totalSales;
    byDate[s.date].profit += s.grossProfit;
  });

  var cells = '';
  for(var i=0;i<leadBlank;i++){ cells += '<div class="cal-cell empty-cell"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var dateStr = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1)+'-'+pad(d);
    var info = byDate[dateStr];
    var isToday = dateStr===todayStr();
    var isSel = dateStr===STATE.calSelectedDate;
    cells += '<div class="cal-cell'+(isToday?' today':'')+(isSel?' selected':'')+'" data-act="select-cal-date" data-date="'+dateStr+'">'+
      '<div class="d">'+d+'</div>'+
      (info? '<div class="amt">'+fmtETB(info.sales)+'</div>' : '')+
      '</div>';
  }
  var dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<div class="cal-dow">'+x+'</div>';}).join('');

  var sel = STATE.calSelectedDate;
  var selStats = periodStats(sel,sel);
  var selSales = STATE.data.sales.filter(function(s){return s.date===sel;});

  return '<div class="two-col">'+
    '<div class="card">'+
      '<div class="cal-nav">'+
        '<button class="btn-outline btn btn-sm" data-act="cal-prev">‹ Prev</button>'+
        '<b>'+monthLabel+'</b>'+
        '<button class="btn-outline btn btn-sm" data-act="cal-next">Next ›</button>'+
      '</div>'+
      '<div class="cal-grid">'+dows+cells+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<h3 style="margin-bottom:8px;">'+fmtDateLong(sel)+'</h3>'+
      '<div class="list-item"><span>Total sales</span><b>'+fmtETB(selStats.totalSales)+'</b></div>'+
      '<div class="list-item"><span>COGS</span><b>'+fmtETB(selStats.cogs)+'</b></div>'+
      '<div class="list-item"><span>Gross profit</span><b>'+fmtETB(selStats.gross)+'</b></div>'+
      '<div class="list-item"><span>Expenses</span><b>'+fmtETB(selStats.expenses)+'</b></div>'+
      '<div class="list-item"><span>Net profit</span><b style="color:var(--green-700);">'+fmtETB(selStats.net)+'</b></div>'+
      '<div class="list-item"><span>Number of sales</span><b>'+selStats.count+'</b></div>'+
      '<h3 style="margin:14px 0 4px;">Sales that day</h3>'+
      (selSales.length? selSales.map(function(s){return '<div class="list-item"><span>'+esc(s.productName)+' ×'+s.quantity+'</span><b>'+fmtETB(s.totalSales)+'</b></div>';}).join('') : '<div class="muted">No sales on this date.</div>')+

/* ---------------- REPORTS ---------------- */
function reportRangeDates(){
  var t = new Date();
  var r = STATE.reportRange;
  if(r==='today') return {from:todayStr(), to:todayStr()};
  if(r==='yesterday'){ var y=addDays(t,-1); return {from:isoDate(y),to:isoDate(y)}; }
  if(r==='week') return {from:isoDate(startOfWeek(t)), to:todayStr()};
  if(r==='month') return {from:isoDate(startOfMonth(t)), to:todayStr()};
  if(r==='year') return {from:isoDate(startOfYear(t)), to:todayStr()};
  if(r==='custom') return {from:STATE.reportCustomFrom, to:STATE.reportCustomTo};
  return {from:todayStr(),to:todayStr()};
}
function renderReports(){
  var range = reportRangeDates();
  var stats = periodStats(range.from, range.to);
  var stockP = sumBy(stockPurchasesInRange(range.from,range.to),'totalCost');
  var salesInR = salesInRange(range.from,range.to);
  var tSales=null,tProfit=null;
  if(salesInR.length){
    var map={};
    salesInR.forEach(function(s){ if(!map[s.date])map[s.date]={sales:0,profit:0}; map[s.date].sales+=s.totalSales; map[s.date].profit+=s.grossProfit; });
    Object.keys(map).forEach(function(d){
      if(!tSales||map[d].sales>tSales.amount) tSales={date:d,amount:map[d].sales};
      if(!tProfit||map[d].profit>tProfit.amount) tProfit={date:d,amount:map[d].profit};
    });
  }
  var opts = [['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['year','This Year'],['custom','Custom Range']];
  var tabs = opts.map(function(o){return '<button class="tab-btn'+(STATE.reportRange===o[0]?' active':'')+'" data-act="report-range" data-range="'+o[0]+'">'+o[1]+'</button>';}).join('');
  return ''+
    '<div class="tabs">'+tabs+'</div>'+
    (STATE.reportRange==='custom' ? (
      '<div class="card" style="margin-bottom:16px;"><div class="form-row">'+
      '<div><label>From</label><input type="date" id="repFrom" value="'+STATE.reportCustomFrom+'"></div>'+
      '<div><label>To</label><input type="date" id="repTo" value="'+STATE.reportCustomTo+'"></div>'+
      '</div></div>'
    ) : '')+
    '<div class="grid grid-4">'+
      statCard('Total Sales', fmtETB(stats.totalSales))+
      statCard('COGS', fmtETB(stats.cogs))+
      statCard('Gross Profit', fmtETB(stats.gross))+
      statCard('Expenses', fmtETB(stats.expenses))+
    '</div>'+
    '<div class="grid grid-4" style="margin-top:14px;">'+
      statCard('Net Profit', fmtETB(stats.net))+
      statCard('Number of Sales', stats.count)+
      statCard('Stock Purchased', fmtETB(stockP))+
      '<div class="card" style="display:flex;align-items:center;justify-content:center;">'+
        '<button class="btn btn-block" data-act="export-excel">📥 Export to Excel</button>'+
      '</div>'+
    '</div>'+
    '<div class="grid grid-2" style="margin-top:20px;">'+
      '<div class="card trophy-card"><div class="trophy-emoji">🏆</div><div><h3>Top Sales Day</h3>'+(tSales?('<div class="trophy-date">'+fmtDateLong(tSales.date)+'</div><div class="trophy-amt">'+fmtETB(tSales.amount)+'</div>'):'<div class="muted">No sales in range</div>')+'</div></div>'+
      '<div class="card trophy-card"><div class="trophy-emoji">🏆</div><div><h3>Top Profit Day</h3>'+(tProfit?('<div class="trophy-date">'+fmtDateLong(tProfit.date)+'</div><div class="trophy-amt">'+fmtETB(tProfit.amount)+'</div>'):'<div class="muted">No sales in range</div>')+'</div></div>'+
    '</div>';
}

/* ---------------- EVENT BINDING ---------------- */
function bindEvents(){
  var app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(function(el){
    el.addEventListener('click', function(){ STATE.view = el.getAttribute('data-nav'); STATE.sidebarOpen=false; render(); });
  });
  app.querySelectorAll('[data-act]').forEach(function(el){
    el.addEventListener('click', function(ev){
      var act = el.getAttribute('data-act');
      handleAction(act, el, ev);
    });
  });
  var modalEl = app.querySelector('.modal');
  if(modalEl) modalEl.addEventListener('click', function(ev){ ev.stopPropagation(); });

  var loginForm = document.getElementById('loginForm');
  if(loginForm) loginForm.addEventListener('submit', onLogin);
  var signupForm = document.getElementById('signupForm');
  if(signupForm) signupForm.addEventListener('submit', onSignup);
  var forgotForm = document.getElementById('forgotForm');
  if(forgotForm) forgotForm.addEventListener('submit', onResetPassword);

  var qs = document.getElementById('quickSaleForm');
  if(qs){
    qs.addEventListener('submit', onQuickSale);
    var prodSel = qs.querySelector('[name=productId]');
    var costI = qs.querySelector('#qsCost');
    var sellI = qs.querySelector('#qsSell');
    var qtyI = qs.querySelector('[name=quantity]');
    function updatePreview(){
      var qty = parseFloat(qtyI.value)||0, cost=parseFloat(costI.value)||0, sell=parseFloat(sellI.value)||0;
      var total = qty*sell, cogs = qty*cost, gross = total-cogs;
      document.getElementById('pvTotal').textContent = fmtETB(total);
      document.getElementById('pvCogs').textContent = fmtETB(cogs);
      document.getElementById('pvGross').textContent = fmtETB(gross);
    }
    if(prodSel){
      var fillFromProduct = function(){
        var opt = prodSel.options[prodSel.selectedIndex];
        if(opt){ costI.value = opt.getAttribute('data-cost'); sellI.value = opt.getAttribute('data-sell'); }
        updatePreview();
      };
      prodSel.addEventListener('change', fillFromProduct);
      fillFromProduct();
    }
    [costI,sellI,qtyI].forEach(function(i){ if(i) i.addEventListener('input', updatePreview); });
    updatePreview();
  }

  var stockForm = document.getElementById('stockForm');
  if(stockForm) stockForm.addEventListener('submit', onAddStock);
  var expenseForm = document.getElementById('expenseForm');
  if(expenseForm) expenseForm.addEventListener('submit', onAddExpense);
  var productForm = document.getElementById('productForm');
  if(productForm) productForm.addEventListener('submit', onSaveProduct);
  var editSaleForm = document.getElementById('editSaleForm');
  if(editSaleForm) editSaleForm.addEventListener('submit', onSaveEditSale);
  var editExpenseForm = document.getElementById('editExpenseForm');
  if(editExpenseForm) editExpenseForm.addEventListener('submit', onSaveEditExpense);

  var salesSearch = document.getElementById('salesSearch');
  if(salesSearch) salesSearch.addEventListener('input', function(){ STATE.salesFilter.search = salesSearch.value; render(); preserveFocus('salesSearch'); });
  var salesDateFilter = document.getElementById('salesDateFilter');
  if(salesDateFilter) salesDateFilter.addEventListener('change', function(){ STATE.salesFilter.date = salesDateFilter.value; render(); });
  var salesProductFilter = document.getElementById('salesProductFilter');
  if(salesProductFilter) salesProductFilter.addEventListener('change', function(){ STATE.salesFilter.product = salesProductFilter.value; render(); });

  var repFrom = document.getElementById('repFrom');
  if(repFrom) repFrom.addEventListener('change', function(){ STATE.reportCustomFrom = repFrom.value; render(); });
  var repTo = document.getElementById('repTo');
  if(repTo) repTo.addEventListener('change', function(){ STATE.reportCustomTo = repTo.value; render(); });
}

function preserveFocus(id){
  var el = document.getElementById(id);
  if(el){ el.focus(); var v=el.value; el.value=''; el.value=v; }
}

function handleAction(act, el, ev){
  if(act==='tab-login'){ STATE.authTab='login'; STATE.authError=''; render(); return; }
  if(act==='tab-signup'){ STATE.authTab='signup'; STATE.authError=''; render(); return; }
  if(act==='forgot'){ STATE.forgotMode=true; STATE.authError=''; STATE.authMsg=''; render(); return; }
  if(act==='back-to-login'){ STATE.forgotMode=false; STATE.authError=''; STATE.authMsg=''; render(); return; }
  if(act==='logout'){ auth.signOut(); return; }
  if(act==='toggle-lang'){ LANG = LANG==='en'?'am':'en'; localStorage.setItem('ssr_lang',LANG); render(); return; }
  if(act==='open-sidebar'){ STATE.sidebarOpen=true; render(); return; }
  if(act==='close-sidebar'){ STATE.sidebarOpen=false; render(); return; }
  if(act==='close-modal' || act==='close-modal-back'){ STATE.modal=null; render(); return; }
  if(act==='clear-sales-filter'){ STATE.salesFilter={search:'',date:'',product:''}; render(); return; }
  if(act==='cal-prev'){ STATE.calMonthCursor = new Date(STATE.calMonthCursor.getFullYear(), STATE.calMonthCursor.getMonth()-1, 1); render(); return; }
  if(act==='cal-next'){ STATE.calMonthCursor = new Date(STATE.calMonthCursor.getFullYear(), STATE.calMonthCursor.getMonth()+1, 1); render(); return; }
  if(act==='select-cal-date'){ STATE.calSelectedDate = el.getAttribute('data-date'); render(); return; }
  if(act==='report-range'){ STATE.reportRange = el.getAttribute('data-range'); render(); return; }
  if(act==='qs-mode'){ STATE.quickSaleMode = el.getAttribute('data-mode'); render(); return; }
  if(act==='add-product'){ STATE.modal={type:'product', data:{}}; render(); return; }
  if(act==='edit-product'){ var p=findProduct(el.getAttribute('data-id')); STATE.modal={type:'product', data:Object.assign({},p)}; render(); return; }
  if(act==='delete-product'){
    if(confirm('Delete this product? This cannot be undone.')){
      deleteProductDoc(el.getAttribute('data-id')).catch(showActionError);
    }
    return;
  }
  if(act==='edit-sale'){
    var s = STATE.data.sales.find(function(x){return x.id===el.getAttribute('data-id');});
    STATE.modal={type:'editSale', data:Object.assign({},s)}; render(); return;
  }
  if(act==='delete-sale'){
    if(confirm('Delete this sale? Stock will be restored.')){ deleteSale(el.getAttribute('data-id')).catch(showActionError); }
    return;
  }
  if(act==='delete-stock'){
    if(confirm('Delete this stock purchase? Stock quantity will be reversed.')){ deleteStockPurchase(el.getAttribute('data-id')).catch(showActionError); }
    return;
  }
  if(act==='edit-expense'){
    var ex = STATE.data.expenses.find(function(x){return x.id===el.getAttribute('data-id');});
    STATE.modal={type:'expense', data:Object.assign({},ex)}; render(); return;
  }
  if(act==='delete-expense'){
    if(confirm('Delete this expense?')){ deleteExpenseDoc(el.getAttribute('data-id')).catch(showActionError); }
    return;
  }
  if(act==='export-excel'){ exportExcel(); return; }
}
function showActionError(err){ alert('Something went wrong: '+((err&&err.message)||err)); }

/* ---------------- FORM HANDLERS ---------------- */
async function onLogin(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);
  var email = fd.get('email').trim().toLowerCase();
  var password = fd.get('password');
  STATE.authError=''; STATE.authBusy=true; render();
  try{
    await auth.signInWithEmailAndPassword(email, password);
    /* onAuthStateChanged takes it from here */
  }catch(err){
    STATE.authError = friendlyAuthError(err);
    STATE.authBusy = false;
    render();
  }
}

async function onSignup(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);
  var shopName=fd.get('shopName').trim(), ownerName=fd.get('ownerName').trim();
  var email=fd.get('email').trim().toLowerCase();
  var password=fd.get('password'), confirmPassword=fd.get('confirmPassword');
  if(password!==confirmPassword){ STATE.authError='Passwords do not match.'; render(); return; }
  STATE.authError=''; STATE.authBusy=true; render();
  try{
    var cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('shops').doc(cred.user.uid).set({
      shopName:shopName, ownerName:ownerName, email:email, createdAt:new Date().toISOString()
    });
    /* onAuthStateChanged takes it from here */
  }catch(err){
    STATE.authError = friendlyAuthError(err);
    STATE.authBusy = false;
    render();
  }
}

async function onResetPassword(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);
  var email = fd.get('email').trim().toLowerCase();
  try{
    await auth.sendPasswordResetEmail(email);
    STATE.authMsg = 'Reset email sent — check your inbox (and spam folder).';
    STATE.authError='';
  }catch(err){
    STATE.authError = friendlyAuthError(err);
    STATE.authMsg='';
  }
  render();
}

async function onQuickSale(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);
  var mode = ev.target.getAttribute('data-mode');
  var qty = parseFloat(fd.get('quantity'));
  var costPrice = parseFloat(fd.get('costPrice'));
  var sellingPrice = parseFloat(fd.get('sellingPrice'));
  var date = fd.get('date');
  var productId, productName;
  var submitBtn = ev.target.querySelector('button[type=submit]');
  if(submitBtn) submitBtn.disabled = true;
  try{
    if(mode==='new'){
      var name = (fd.get('newProductName')||'').trim();
      var existing = STATE.data.products.find(function(p){ return p.name.toLowerCase()===name.toLowerCase(); });
      if(existing){
        productId = existing.id; productName = existing.name;
        await saveProductDoc({costPrice:costPrice, sellingPrice:sellingPrice}, productId);
      } else {
        var newRef = shopRef().collection('products').doc();
        await newRef.set({
          name:name, category:(fd.get('newProductCategory')||'').trim(),
          costPrice:costPrice, sellingPrice:sellingPrice,
          openingStock:qty, currentStock:qty, reorderLevel:0
        });
        productId = newRef.id; productName = name;
      }
    } else {
      productId = fd.get('productId');
      var p = findProduct(productId);
      productName = p ? p.name : '';
    }
    await addSale({date:date, productId:productId, productName:productName, quantity:qty, costPrice:costPrice, sellingPrice:sellingPrice});
    STATE.view='sales';
    render();
  }catch(err){
    showActionError(err);
    if(submitBtn) submitBtn.disabled = false;
  }
}

async function onSaveProduct(ev){
  ev.preventDefault();
  var fd = new FormData(ev.target);

  try{
    if(editing){
      var fields = {
        name: fd.get('name'), category: fd.get('category'),
        costPrice: parseFloat(fd.get('costPrice')), sellingPrice: parseFloat(fd.get('sellingPrice')),
        openingStock: parseFloat(fd.get('openingStock')), reorderLevel: parseFloat(fd.get('reorderLevel'))||0
      };
      var cs = fd.get('currentStock'); if(cs!==null && cs!=='') fields.currentStock = parseFloat(cs);
      await saveProductDoc(fields, editing);
    } else {
      var opening = parseFloat(fd.get('openingStock'))||0;
      await saveProductDoc({
        name:fd.get('name'), category:fd.get('category'),
        costPrice:parseFloat(fd.get('costPrice')), sellingPrice:parseFloat(fd.get('sellingPrice')),
        openingStock:opening, currentStock:opening, reorderLevel:parseFloat(fd.get('reorderLevel'))||0
      }, null);
    }
    STATE.modal=null;
    render();
  }catch(err){ showActionError(err); }
}

/* ---------------- EXCEL EXPORT ---------------- */
async function exportExcel(){
  if(typeof XLSX === 'undefined'){ alert('Excel export library failed to load. Check your connection and try again.'); return; }
  var wb = XLSX.utils.book_new();

  var salesRows = STATE.data.sales.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).map(function(s){
    return {Date:s.date, Product:s.productName, Quantity:s.quantity, 'Cost Price':s.costPrice, 'Selling Price':s.sellingPrice, 'Total Sales':s.totalSales, COGS:s.cogs, 'Gross Profit':s.grossProfit, 'Created At':s.createdAt};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesRows.length?salesRows:[{Date:'',Product:'',Quantity:'',"Cost Price":'',"Selling Price":'',"Total Sales":'',COGS:'',"Gross Profit":'',"Created At":''}]), 'Sales');

  var expRows = STATE.data.expenses.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).map(function(e){
    return {Date:e.date, Category:e.category, Description:e.description, Amount:e.amount, Notes:e.notes};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expRows.length?expRows:[{Date:'',Category:'',Description:'',Amount:'',Notes:''}]), 'Expenses');

  var stockRows = STATE.data.stockPurchases.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).map(function(sp){
    return {Date:sp.date, Product:sp.productName, Quantity:sp.quantity, 'Unit Cost':sp.unitCost, 'Total Cost':sp.totalCost, Supplier:sp.supplier, Notes:sp.notes};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockRows.length?stockRows:[{Date:'',Product:'',Quantity:'',"Unit Cost":'',"Total Cost":'',Supplier:'',Notes:''}]), 'Stock Purchases');

  var prodRows = STATE.data.products.map(function(p){
    return {Name:p.name, Category:p.category, 'Cost Price':p.costPrice, 'Selling Price':p.sellingPrice, 'Opening Stock':p.openingStock, 'Current Stock':p.currentStock, 'Reorder Level':p.reorderLevel};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prodRows.length?prodRows:[{Name:'',Category:'',"Cost Price":'',"Selling Price":'',"Opening Stock":'',"Current Stock":'',"Reorder Level":''}]), 'Products');

  var range = reportRangeDates();
  var stats = periodStats(range.from, range.to);
  var stockP = sumBy(stockPurchasesInRange(range.from,range.to),'totalCost');
  var summaryRows = [
    {Metric:'Date range', Value: range.from+' to '+range.to},
    {Metric:'Total Sales', Value: stats.totalSales},
    {Metric:'COGS', Value: stats.cogs},
    {Metric:'Gross Profit', Value: stats.gross},
    {Metric:'Expenses', Value: stats.expenses},
    {Metric:'Net Profit', Value: stats.net},
    {Metric:'Number of Sales', Value: stats.count},
    {Metric:'Stock Purchased', Value: stockP}
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows), 'Report Summary');

  var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  var blob = new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var filename = 'shop-sales-record-'+todayStr()+'.xlsx';

  try{
    var downloads = window.claude ? await window.claude.use('downloads') : null;
    if(downloads){
      await downloads.save({filename: filename, data: blob});
    } else {
      fallbackDownload(blob, filename);
    }
  }catch(err){
    if(err && err.code === 'declined'){ /* user cancelled, no-op */ }
    else { fallbackDownload(blob, filename); }
  }
}
function fallbackDownload(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
